<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:">
<meta name="color-scheme" content="light dark">
<title>ideamine</title>
<style>
/* Theme tokens. Dark mode overrides the same names. */
:root {
  color-scheme: light dark;
  --bg: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f1f1ee;
  --text: #0b0b0b;
  --text-dim: #52514e;
  --text-muted: #898781;
  --border: #e1e0d9;
  --border-strong: #c3c2b7;
  --accent: #2a78d6;
  --focus-ring: #2a78d6;
  --shadow: 0 8px 24px rgba(11, 11, 11, 0.16);
  --lane-doing: #2a78d6;
  --lane-do: #1baf7a;
  --lane-maybe: #eda100;
  --lane-inbox: #898781;
  --lane-skip: #4a3aa7;
  --lane-done: #0ca30c;
  --lane-dropped: #d03b3b;
  --phase-inbox: #86b6ef;
  --phase-queued: #3987e5;
  --phase-doing: #184f95;
  --now-line: #0b0b0b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232322;
    --text: #ffffff;
    --text-dim: #c3c2b7;
    --text-muted: #898781;
    --border: #2c2c2a;
    --border-strong: #383835;
    --accent: #3987e5;
    --focus-ring: #86b6ef;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    --lane-doing: #3987e5;
    --lane-do: #199e70;
    --lane-maybe: #c98500;
    --lane-inbox: #898781;
    --lane-skip: #9085e9;
    --lane-done: #0ca30c;
    --lane-dropped: #e66767;
    --phase-inbox: #184f95;
    --phase-queued: #3987e5;
    --phase-doing: #86b6ef;
    --now-line: #ffffff;
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.45;
}
h1, h2, h3, p, dl, dd { margin: 0; }
button { font: inherit; color: inherit; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

/* header */
.app-header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
.header-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 12px; }
.header-top { justify-content: space-between; padding-top: 10px; }
.brand { font-size: 18px; font-weight: 700; }
.updated { color: var(--text-muted); font-size: 12px; }
.counts { padding-top: 0; }
.count-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-dim); }
.count-chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--chip-color); flex: none; }
.header-controls { padding-top: 0; padding-bottom: 10px; }
.tabs { display: flex; gap: 4px; }
.tabs button { padding: 6px 12px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 6px; cursor: pointer; }
.tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.parked-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); white-space: nowrap; cursor: pointer; }
.search-input { flex: 1 1 160px; min-width: 120px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); }

/* layout */
main { padding: 12px; }
.empty-note { color: var(--text-muted); padding: 24px 4px; }
.load-error { padding: 24px; color: var(--lane-dropped); }

/* board */
.board { display: flex; align-items: flex-start; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
.column { flex: 0 0 260px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.column-header { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border); font-weight: 600; }
.column-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--chip-color); flex: none; }
.column-title { flex: 1; }
.column-count { color: var(--text-muted); font-weight: 400; }
.column-body { display: flex; flex-direction: column; gap: 8px; padding: 8px; min-height: 12px; }
.column-empty { color: var(--text-muted); font-size: 12px; padding: 4px; }

/* ticket cards */
.card { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.card:hover { border-color: var(--border-strong); }
.card-compact { padding: 6px 8px; }
.card-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.card-key { font-size: 11px; color: var(--text-muted); }
.card-chips { display: flex; gap: 4px; flex-wrap: wrap; }
.card-title { font-size: 13px; }
.card-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.card-project { font-size: 11px; color: var(--text-muted); }
.card-score { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--accent); }

/* chips (lane / model / size / impact / tag) */
.chip { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 999px; padding: 1px 8px; font-size: 11px; color: var(--text-dim); background: var(--surface-2); white-space: nowrap; }
.chip-lane { border-color: var(--chip-color); color: var(--chip-color); font-weight: 600; background: transparent; }
.chip-model { text-transform: capitalize; }
.chip-tag::before { content: "#"; opacity: .6; }

/* groups view */
.group-section { margin-bottom: 20px; }
.group-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.group-count { color: var(--text-muted); font-weight: 400; }
.group-cards { display: flex; flex-wrap: wrap; gap: 8px; }
.group-cards .card { width: 220px; }

/* search results */
.search-mode { color: var(--text-muted); font-size: 12px; margin-bottom: 8px; }
.search-list { display: flex; flex-direction: column; gap: 8px; max-width: 520px; }

/* timeline (gantt) */
.tl-legend { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 6px 2px 10px; font-size: 12px; color: var(--text-dim); }
.tl-legend-item { display: inline-flex; align-items: center; gap: 5px; }
.tl-legend-swatch { display: inline-block; width: 14px; height: 10px; border-radius: 2px; background: var(--chip-color); }
.tl-legend-hatch { background-image: repeating-linear-gradient(45deg, var(--chip-color) 0 2px, transparent 2px 4px); }
.tl-legend-mark { font-weight: 700; }
.tl-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
.tl-inner { display: flex; align-items: flex-start; width: max-content; }
.tl-labels { position: sticky; left: 0; z-index: 2; background: var(--surface); border-right: 1px solid var(--border); flex: 0 0 auto; }
.tl-label-header { border-bottom: 1px solid var(--border); }
.tl-label-row { display: flex; align-items: center; gap: 6px; width: 220px; padding: 0 8px; border: 0; border-bottom: 1px solid var(--border); background: none; cursor: pointer; text-align: left; }
.tl-label-row:hover, .tl-label-row:focus-visible { background: var(--surface-2); }
.tl-label-key { font-size: 11px; color: var(--text-muted); flex: none; }
.tl-label-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-chart { flex: 0 0 auto; }
.tl-grid { stroke: var(--border); stroke-width: 1; }
.tl-tick-label { fill: var(--text-muted); font-size: 10px; }
.tl-now { stroke: var(--now-line); stroke-width: 1.5; stroke-dasharray: 4 3; }
.tl-now-label { fill: var(--now-line); font-size: 10px; }
.tl-seg-inbox { fill: var(--phase-inbox); }
.tl-seg-queued { fill: var(--phase-queued); }
.tl-seg-doing { fill: var(--phase-doing); }
.tl-seg-estimated.tl-seg-inbox { fill: url(#hatch-inbox); }
.tl-seg-estimated.tl-seg-queued { fill: url(#hatch-queued); }
.tl-seg-estimated.tl-seg-doing { fill: url(#hatch-doing); }
.tl-seg { cursor: pointer; }
.tl-seg:hover, .tl-seg:focus-visible { stroke: var(--text); stroke-width: 1.5; outline: none; }
.tl-end-mark { font-size: 13px; font-weight: 700; dominant-baseline: middle; }
.tl-end-done { fill: var(--lane-done); }
.tl-end-dropped { fill: var(--lane-dropped); }

/* detail drawer */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); z-index: 20; }
.drawer-backdrop[hidden] { display: none; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 100%; background: var(--surface); box-shadow: var(--shadow); z-index: 21; overflow-y: auto; padding: 16px; }
.drawer[hidden] { display: none; }
@media (max-width: 640px) { .drawer { width: 100%; } }
.drawer-close { position: sticky; top: 0; float: right; background: none; border: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--text-dim); }
.drawer-title { font-size: 16px; font-weight: 700; margin: 4px 0 10px; clear: both; }
.drawer-key { color: var(--text-muted); font-size: 13px; margin-right: 6px; }
.drawer-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.drawer-meta { color: var(--text-dim); font-size: 12px; margin-bottom: 10px; }
.date-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12px; margin-bottom: 14px; }
.date-grid dt { color: var(--text-muted); }
.drawer-section { margin-bottom: 16px; }
.drawer-section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 6px; }
.drawer-text { white-space: pre-wrap; font-size: 13px; }
.notes { display: flex; flex-direction: column; gap: 8px; }
.note { border-left: 2px solid var(--border-strong); padding-left: 8px; }
.note-at { font-size: 11px; color: var(--text-muted); }
.note-text { white-space: pre-wrap; font-size: 13px; }
.link-button { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; text-align: left; font: inherit; }
.related-list { display: flex; flex-direction: column; gap: 6px; }
.related-item { display: flex; align-items: center; gap: 8px; width: 100%; }
.related-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.related-score { color: var(--text-muted); font-size: 11px; }
.text-muted { color: var(--text-muted); }

/* hover / tap preview for timeline bars */
.tooltip { position: fixed; z-index: 30; max-width: 240px; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: var(--shadow); pointer-events: none; }
.tooltip[hidden] { display: none; }
.tooltip-key { font-weight: 700; }
.tooltip-title { color: var(--text-dim); margin: 2px 0; }
.tooltip-phase { color: var(--text-muted); }

/* focus */
button:focus-visible, input:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-row header-top">
    <h1 class="brand">ideamine</h1>
    <span class="updated" id="updated"></span>
  </div>
  <div class="header-row counts" id="counts" aria-label="Idea counts by lane"></div>
  <div class="header-row header-controls">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" data-view="board" aria-controls="main">Board</button>
      <button type="button" role="tab" data-view="timeline" aria-controls="main">Timeline</button>
      <button type="button" role="tab" data-view="groups" aria-controls="main">Groups</button>
    </nav>
    <label class="parked-toggle">
      <input type="checkbox" id="parked-toggle"> Show parked
    </label>
    <input type="search" id="search-input" class="search-input" placeholder="Search ideas…" aria-label="Search ideas">
  </div>
</header>

<main id="main" role="tabpanel"></main>

<div class="drawer-backdrop" id="drawer-backdrop" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-labelledby="drawer-title">
  <button class="drawer-close" id="drawer-close" type="button" aria-label="Close">×</button>
  <div id="drawer-body"></div>
</aside>

<div class="tooltip" id="tooltip" hidden role="status"></div>

<script>
'use strict';

/* ideamine dashboard. One file, no build step, no external calls
   besides data.json and v1/embeddings on the same origin. */

const SVG_NS = 'http://www.w3.org/2000/svg';
const MIN = 60000, HOUR = 3600000, DAY = 86400000;
const TL_STEPS = [MIN, 5 * MIN, 15 * MIN, 30 * MIN, HOUR, 3 * HOUR, 6 * HOUR, 12 * HOUR, DAY, 2 * DAY, 7 * DAY, 30 * DAY, 90 * DAY];
const TL_ROW_H = 34, TL_HEADER_H = 28, TL_BAR_H = 16;
const BOARD_LANES = ['doing', 'do', 'maybe', 'inbox', 'done'];
const PARKED_LANES = ['skip', 'dropped'];
const ALL_LANES = ['doing', 'do', 'maybe', 'inbox', 'skip', 'done', 'dropped'];
const LANE_LABELS = { doing: 'Doing', do: 'Do', maybe: 'Maybe', inbox: 'Inbox', skip: 'Skip', done: 'Done', dropped: 'Dropped' };
const PHASE_LABELS = { inbox: 'Inbox', queued: 'Queued', doing: 'Doing' };
const SEARCH_DEBOUNCE_MS = 300;
const EMBED_TIMEOUT_MS = 4000;

const state = {
  data: null,
  byId: new Map(),
  byKey: new Map(),
  view: 'board',
  showParked: false,
  openKey: null,
  query: '',
  searchResult: null,
};

let searchTimer = null;
let searchToken = 0;
let lastFocused = null;
const vecCache = new Map();

const $main = document.getElementById('main');
const $counts = document.getElementById('counts');
const $updated = document.getElementById('updated');
const $tabs = document.getElementById('tabs');
const $parkedToggle = document.getElementById('parked-toggle');
const $searchInput = document.getElementById('search-input');
const $drawer = document.getElementById('drawer');
const $drawerBackdrop = document.getElementById('drawer-backdrop');
const $drawerClose = document.getElementById('drawer-close');
const $drawerBody = document.getElementById('drawer-body');
const $tooltip = document.getElementById('tooltip');

/* ---- small DOM builders. Text children become text nodes, never HTML. ---- */

function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    node.append(kid.nodeType ? kid : String(kid));
  }
  return node;
}

function svgEl(tag, attrs, ...kids) {
  const node = document.createElementNS(SVG_NS, tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      node.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    node.append(kid.nodeType ? kid : String(kid));
  }
  return node;
}

/* ---- formatting ---- */

// The page text is English, so dates and "5 minutes ago" are English too, whatever the browser locale.
const LOCALE = 'en';

function fmtDate(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleString(LOCALE, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function fmtRelative(iso) {
  const then = new Date(iso).getTime();
  if (Number.isNaN(then)) return 'at an unknown time';
  const diffSec = Math.round((then - Date.now()) / 1000);
  const rtf = new Intl.RelativeTimeFormat(LOCALE, { numeric: 'auto' });
  const units = [['year', 31536000], ['month', 2592000], ['day', 86400], ['hour', 3600], ['minute', 60], ['second', 1]];
  for (const [unit, secs] of units) {
    if (Math.abs(diffSec) >= secs || unit === 'second') return rtf.format(Math.round(diffSec / secs), unit);
  }
}

function formatTick(t, step) {
  const d = new Date(t);
  if (step < HOUR) return d.toLocaleTimeString(LOCALE, { hour: '2-digit', minute: '2-digit' });
  if (step < DAY) return d.toLocaleString(LOCALE, { month: 'short', day: 'numeric', hour: '2-digit' });
  if (step < 30 * DAY) return d.toLocaleDateString(LOCALE, { month: 'short', day: 'numeric' });
  return d.toLocaleDateString(LOCALE, { month: 'short', year: 'numeric' });
}

/* ---- vectors: decode base64 little-endian float32, dot product ---- */

function decodeVec(b64) {
  if (!b64) return null;
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const view = new DataView(bytes.buffer);
  const n = Math.floor(bin.length / 4);
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) out[i] = view.getFloat32(i * 4, true);
  return out;
}

function getIdeaVec(idea) {
  if (!idea.vec) return null;
  if (vecCache.has(idea.id)) return vecCache.get(idea.id);
  const v = decodeVec(idea.vec);
  vecCache.set(idea.id, v);
  return v;
}

function normalize(arr) {
  let sum = 0;
  for (let i = 0; i < arr.length; i++) sum += arr[i] * arr[i];
  const norm = Math.sqrt(sum) || 1;
  const out = new Float64Array(arr.length);
  for (let i = 0; i < arr.length; i++) out[i] = arr[i] / norm;
  return out;
}

function dot(a, b) {
  const n = Math.min(a.length, b.length);
  let s = 0;
  for (let i = 0; i < n; i++) s += a[i] * b[i];
  return s;
}

function findByKey(key) { return state.byKey.get(key.toUpperCase()) || null; }

/* ---- ticket card, shared by board, groups, and search results ---- */

function ideaCard(idea, opts) {
  opts = opts || {};
  const chips = [el('span', { class: 'chip chip-lane', style: '--chip-color:var(--lane-' + idea.lane + ')' }, LANE_LABELS[idea.lane] || idea.lane)];
  if (idea.model) chips.push(el('span', { class: 'chip chip-model' }, idea.model));
  if (idea.size) chips.push(el('span', { class: 'chip' }, idea.size.toUpperCase()));
  if (idea.impact != null) chips.push(el('span', { class: 'chip chip-impact' }, '▲' + idea.impact));

  const top = el('div', { class: 'card-top' }, el('code', { class: 'card-key' }, idea.key), el('span', { class: 'card-chips' }, chips));
  if (opts.scoreLabel) top.append(el('span', { class: 'card-score' }, opts.scoreLabel));

  const meta = [];
  if (idea.project) meta.push(el('span', { class: 'card-project' }, idea.project));
  for (const t of idea.tags || []) meta.push(el('span', { class: 'chip chip-tag' }, t));

  return el('button', { class: 'card' + (opts.compact ? ' card-compact' : ''), type: 'button', onclick: () => openTicket(idea.key) },
    top,
    el('div', { class: 'card-title' }, idea.title),
    meta.length ? el('div', { class: 'card-meta' }, meta) : null);
}

/* ---- header: counts + relative update time ---- */

function renderHeader() {
  $counts.textContent = '';
  const counts = state.data.counts || {};
  for (const lane of ALL_LANES) {
    $counts.append(el('span', { class: 'count-chip' },
      el('span', { class: 'count-chip-dot', style: '--chip-color:var(--lane-' + lane + ')' }),
      LANE_LABELS[lane] + ' ' + (counts[lane] ?? 0)));
  }
  $updated.textContent = 'updated ' + fmtRelative(state.data.generated);
  $updated.title = fmtDate(state.data.generated) || '';
}

function renderTabsActive() {
  for (const btn of $tabs.querySelectorAll('button')) {
    const active = btn.dataset.view === state.view;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', String(active));
  }
}

/* ---- board view ---- */

function renderColumn(lane) {
  const ideas = state.data.ideas.filter((i) => i.lane === lane).sort((a, b) => a.rank - b.rank);
  return el('div', { class: 'column' },
    el('div', { class: 'column-header' },
      el('span', { class: 'column-dot', style: '--chip-color:var(--lane-' + lane + ')' }),
      el('span', { class: 'column-title' }, LANE_LABELS[lane]),
      el('span', { class: 'column-count' }, String(ideas.length))),
    el('div', { class: 'column-body' }, ideas.length ? ideas.map((i) => ideaCard(i)) : el('p', { class: 'column-empty' }, 'No tickets')));
}

function renderBoard() {
  $main.textContent = '';
  const lanes = state.showParked ? BOARD_LANES.concat(PARKED_LANES) : BOARD_LANES;
  $main.append(el('div', { class: 'board' }, lanes.map(renderColumn)));
}

/* ---- groups view ---- */

function renderGroupSection(label, ideas) {
  return el('section', { class: 'group-section' },
    el('h2', { class: 'group-title' }, label + ' ', el('span', { class: 'group-count' }, '(' + ideas.length + ')')),
    el('div', { class: 'group-cards' }, ideas.map((i) => ideaCard(i, { compact: true }))));
}

function renderGroups() {
  $main.textContent = '';
  const wrap = el('div', { class: 'groups' });
  const grouped = new Set();
  for (const g of state.data.groups || []) {
    const ideas = g.ids.map((id) => state.byId.get(id)).filter(Boolean);
    for (const id of g.ids) grouped.add(id);
    wrap.append(renderGroupSection(g.label, ideas));
  }
  const ungrouped = state.data.ideas.filter((i) => !grouped.has(i.id));
  if (ungrouped.length) wrap.append(renderGroupSection('Ungrouped', ungrouped));
  $main.append(wrap);
}

/* ---- timeline (gantt) view ---- */

function chooseStep(spanMs, targetTicks) {
  for (const step of TL_STEPS) { if (spanMs / step <= targetTicks) return step; }
  return TL_STEPS[TL_STEPS.length - 1];
}

function buildTimeScale(domainStart, domainEnd) {
  const span = Math.max(domainEnd - domainStart, 1);
  const step = chooseStep(span, 8);
  const ticksCount = Math.ceil(span / step) + 1;
  const width = Math.max(640, ticksCount * 90);
  const pxPerMs = width / span;
  const ticks = [];
  const first = Math.ceil(domainStart / step) * step;
  for (let t = first; t <= domainEnd; t += step) ticks.push(t);
  return { width, step, ticks, x: (t) => (t - domainStart) * pxPerMs };
}

function makeHatchPattern(id, colorVar) {
  return svgEl('pattern', { id, patternUnits: 'userSpaceOnUse', width: 6, height: 6, patternTransform: 'rotate(45)' },
    svgEl('rect', { width: 6, height: 6, fill: colorVar, 'fill-opacity': 0.35 }),
    svgEl('line', { x1: 0, y1: 0, x2: 0, y2: 6, stroke: colorVar, 'stroke-width': 3 }));
}

function tooltipContentForSegment(idea, seg) {
  const to = seg.to ? fmtDate(seg.to) : 'now';
  return el('div', {},
    el('div', { class: 'tooltip-key' }, idea.key + (seg.estimated ? ' (estimated)' : '')),
    el('div', { class: 'tooltip-title' }, idea.title),
    el('div', { class: 'tooltip-phase' }, (PHASE_LABELS[seg.phase] || seg.phase) + ': ' + fmtDate(seg.from) + ' → ' + to));
}

function positionTooltip(evt, node) {
  const rect = node.getBoundingClientRect();
  const x = evt.clientX ?? (rect.left + rect.width / 2);
  const y = evt.clientY ?? rect.top;
  const pad = 12, tw = 240, th = 90;
  let left = x + pad, top = y + pad;
  if (left + tw > window.innerWidth) left = x - tw - pad;
  if (top + th > window.innerHeight) top = y - th - pad;
  $tooltip.style.left = Math.max(4, left) + 'px';
  $tooltip.style.top = Math.max(4, top) + 'px';
}

function attachTooltip(node, contentFn) {
  const show = (evt) => {
    $tooltip.textContent = '';
    $tooltip.append(contentFn());
    $tooltip.hidden = false;
    positionTooltip(evt, node);
  };
  const hide = () => { $tooltip.hidden = true; };
  node.addEventListener('mouseenter', show);
  node.addEventListener('mousemove', (e) => { if (!$tooltip.hidden) positionTooltip(e, node); });
  node.addEventListener('mouseleave', hide);
  node.addEventListener('focus', show);
  node.addEventListener('blur', hide);
  node.addEventListener('click', (e) => { e.stopPropagation(); show(e); });
}

function renderTimelineRow(idea, y, scale) {
  const g = svgEl('g', { class: 'tl-row' });
  const barY = y + (TL_ROW_H - TL_BAR_H) / 2;
  const phases = idea.phases || [];
  let endX = null;
  phases.forEach((seg, i) => {
    const from = Date.parse(seg.from);
    if (Number.isNaN(from)) return;
    const to = seg.to ? Date.parse(seg.to) : Date.now();
    let x1 = scale.x(from);
    let x2 = scale.x(Math.max(to, from));
    if (i > 0) x1 += 1;
    if (i < phases.length - 1) x2 -= 1;
    const w = Math.max(x2 - x1, 1);
    const phaseName = seg.phase || 'inbox';
    const rect = svgEl('rect', {
      x: x1, y: barY, width: w, height: TL_BAR_H, rx: 3,
      class: 'tl-seg tl-seg-' + phaseName + (seg.estimated ? ' tl-seg-estimated' : ''),
      tabindex: '0', role: 'img',
      'aria-label': idea.key + ' ' + (PHASE_LABELS[phaseName] || phaseName) + ' from ' + fmtDate(seg.from) + ' to ' + (seg.to ? fmtDate(seg.to) : 'now'),
    });
    attachTooltip(rect, () => tooltipContentForSegment(idea, seg));
    g.append(rect);
    endX = x1 + w;
  });
  if (endX != null && (idea.lane === 'done' || idea.lane === 'dropped')) {
    const mark = idea.lane === 'done' ? '✓' : '✗';
    g.append(svgEl('text', { x: endX + 6, y: y + TL_ROW_H / 2 + 4, class: 'tl-end-mark tl-end-' + idea.lane }, mark));
  }
  return g;
}

function renderTimelineLegend() {
  function item(colorVar, label, hatch) {
    return el('span', { class: 'tl-legend-item' }, el('span', { class: 'tl-legend-swatch' + (hatch ? ' tl-legend-hatch' : ''), style: '--chip-color:' + colorVar }), label);
  }
  return el('div', { class: 'tl-legend' },
    item('var(--phase-inbox)', 'Inbox'),
    item('var(--phase-queued)', 'Queued'),
    item('var(--phase-doing)', 'Doing'),
    item('var(--phase-doing)', 'Estimated', true),
    el('span', { class: 'tl-legend-item' }, el('span', { class: 'tl-legend-mark', style: 'color:var(--lane-done)' }, '✓'), 'Done'),
    el('span', { class: 'tl-legend-item' }, el('span', { class: 'tl-legend-mark', style: 'color:var(--lane-dropped)' }, '✗'), 'Dropped'));
}

function renderTimeline() {
  $main.textContent = '';
  const ideas = state.data.ideas
    .filter((i) => state.showParked || (i.lane !== 'skip' && i.lane !== 'dropped'))
    .slice()
    .sort((a, b) => Date.parse(a.created) - Date.parse(b.created));

  if (!ideas.length) {
    $main.append(el('p', { class: 'empty-note' }, 'No ideas to show.'));
    return;
  }

  const now = Date.now();
  let domainStart = Infinity, domainEnd = -Infinity;
  for (const idea of ideas) {
    for (const seg of idea.phases || []) {
      const from = Date.parse(seg.from);
      const to = seg.to ? Date.parse(seg.to) : now;
      if (!Number.isNaN(from)) domainStart = Math.min(domainStart, from);
      if (!Number.isNaN(to)) domainEnd = Math.max(domainEnd, to);
    }
  }
  if (!Number.isFinite(domainStart)) domainStart = now - DAY;
  domainEnd = Math.max(domainEnd, now);
  const pad = (domainEnd - domainStart) * 0.03 || HOUR;
  domainStart -= pad;
  domainEnd += pad;

  const scale = buildTimeScale(domainStart, domainEnd);
  const chartHeight = TL_HEADER_H + ideas.length * TL_ROW_H;

  const defs = svgEl('defs', {}, makeHatchPattern('hatch-inbox', 'var(--phase-inbox)'), makeHatchPattern('hatch-queued', 'var(--phase-queued)'), makeHatchPattern('hatch-doing', 'var(--phase-doing)'));

  const axis = svgEl('g', { class: 'tl-axis' });
  for (const t of scale.ticks) {
    const x = scale.x(t);
    axis.append(svgEl('line', { x1: x, x2: x, y1: TL_HEADER_H, y2: chartHeight, class: 'tl-grid' }), svgEl('text', { x: x + 4, y: TL_HEADER_H - 8, class: 'tl-tick-label' }, formatTick(t, scale.step)));
  }

  const rows = svgEl('g', { class: 'tl-rows' });
  ideas.forEach((idea, i) => rows.append(renderTimelineRow(idea, TL_HEADER_H + i * TL_ROW_H, scale)));

  const svgRoot = svgEl('svg', { width: scale.width, height: chartHeight, viewBox: '0 0 ' + scale.width + ' ' + chartHeight, role: 'img', 'aria-label': 'Idea timeline' }, defs, axis, rows);

  if (now >= domainStart && now <= domainEnd) {
    const nx = scale.x(now);
    svgRoot.append(svgEl('line', { x1: nx, x2: nx, y1: 0, y2: chartHeight, class: 'tl-now' }), svgEl('text', { x: nx - 4, y: 11, 'text-anchor': 'end', class: 'tl-now-label' }, 'now'));
  }

  const labels = el('div', { class: 'tl-labels' },
    el('div', { class: 'tl-label-header', style: 'height:' + TL_HEADER_H + 'px' }),
    ideas.map((idea) => el('button', { class: 'tl-label-row', type: 'button', style: 'height:' + TL_ROW_H + 'px', onclick: () => openTicket(idea.key) },
      el('code', { class: 'tl-label-key' }, idea.key),
      el('span', { class: 'tl-label-title' }, idea.title))));

  const scroll = el('div', { class: 'tl-scroll' }, el('div', { class: 'tl-inner' }, labels, el('div', { class: 'tl-chart' }, svgRoot)));
  $main.append(renderTimelineLegend(), scroll);
}

/* ---- search: semantic first, word fallback ---- */

function wordSearch(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const items = [];
  for (const idea of state.data.ideas) {
    const hay = [idea.title, idea.text, (idea.tags || []).join(' '), idea.brief].filter(Boolean).join(' \n ').toLowerCase();
    let score = 0;
    for (const w of words) { if (hay.includes(w)) score++; }
    if (score >= 1) items.push({ idea, score });
  }
  items.sort((a, b) => b.score - a.score);
  return { mode: 'words', items };
}

async function trySemanticSearch(q, embed) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), EMBED_TIMEOUT_MS);
  try {
    const res = await fetch('v1/embeddings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: embed.model, input: [embed.query_prefix + q] }),
      signal: ctrl.signal,
    });
    if (!res.ok) return null;
    const json = await res.json();
    const raw = json && json.data && json.data[0] && json.data[0].embedding;
    if (!Array.isArray(raw) || raw.length === 0) return null;
    const qvec = normalize(raw);
    const threshold = embed.search_threshold ?? 0.5;
    const items = [];
    for (const idea of state.data.ideas) {
      const vec = getIdeaVec(idea);
      if (!vec) continue;
      const score = dot(qvec, vec);
      if (score >= threshold) items.push({ idea, score });
    }
    items.sort((a, b) => b.score - a.score);
    return { mode: 'meaning', items };
  } catch (err) {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

async function runSearch(query) {
  const q = query.trim();
  if (!q) { state.searchResult = null; render(); return; }
  const token = ++searchToken;
  state.searchResult = null;
  render();
  const embed = state.data.embed || {};
  const hasVecs = state.data.ideas.some((i) => i.vec);
  let result = null;
  if (embed.available && hasVecs) result = await trySemanticSearch(q, embed);
  if (token !== searchToken) return;
  if (!result) result = wordSearch(q);
  state.searchResult = result;
  render();
}

function searchResultCard(item) {
  const label = state.searchResult.mode === 'meaning' ? Math.round(item.score * 100) + '%' : item.score + (item.score === 1 ? ' word' : ' words');
  return ideaCard(item.idea, { compact: true, scoreLabel: label });
}

function renderSearch() {
  $main.textContent = '';
  if (!state.searchResult) { $main.append(el('p', { class: 'empty-note' }, 'Searching…')); return; }
  const { mode, items } = state.searchResult;
  const modeLabel = mode === 'meaning' ? 'Showing results by meaning' : 'Showing results by words, meaning search is not available';
  const wrap = el('div', { class: 'search-results' }, el('p', { class: 'search-mode' }, modeLabel));
  if (!items.length) wrap.append(el('p', { class: 'empty-note' }, 'No matching ideas.'));
  else wrap.append(el('div', { class: 'search-list' }, items.map(searchResultCard)));
  $main.append(wrap);
}

/* ---- detail drawer ---- */

function renderDateGrid(idea) {
  const grid = el('dl', { class: 'date-grid' });
  for (const [label, value] of [['Created', idea.created], ['Triaged', idea.triaged], ['Started', idea.started], ['Closed', idea.closed]]) {
    grid.append(el('dt', {}, label), el('dd', {}, value ? fmtDate(value) : '—'));
  }
  return grid;
}

function renderNotes(notes) {
  if (!notes || !notes.length) return null;
  const list = el('div', { class: 'notes' });
  for (const note of notes) list.append(el('div', { class: 'note' }, el('div', { class: 'note-at' }, fmtDate(note.at)), el('div', { class: 'note-text' }, note.text)));
  return el('section', { class: 'drawer-section' }, el('h3', {}, 'Notes'), list);
}

function renderDupOf(dupId) {
  const target = state.byId.get(dupId);
  const key = target ? target.key : 'IDEA-' + dupId;
  const content = target
    ? el('button', { class: 'link-button', type: 'button', onclick: () => openTicket(target.key) }, key + ' — ' + target.title)
    : el('span', { class: 'text-muted' }, key + ' (not found)');
  return el('section', { class: 'drawer-section' }, el('h3', {}, 'Duplicate of'), content);
}

function renderRelated(related) {
  const list = el('div', { class: 'related-list' });
  for (const r of related) {
    const target = state.byId.get(r.id);
    if (!target) continue;
    const pct = Math.round((r.score ?? 0) * 100) + '%';
    list.append(el('button', { class: 'link-button related-item', type: 'button', onclick: () => openTicket(target.key) },
      el('code', { class: 'card-key' }, target.key), el('span', { class: 'related-title' }, target.title), el('span', { class: 'related-score' }, pct)));
  }
  if (!list.childNodes.length) return null;
  return el('section', { class: 'drawer-section' }, el('h3', {}, 'Related'), list);
}

function buildDrawerContent(idea) {
  const frag = document.createDocumentFragment();
  const chips = el('div', { class: 'drawer-chips' }, el('span', { class: 'chip chip-lane', style: '--chip-color:var(--lane-' + idea.lane + ')' }, LANE_LABELS[idea.lane] || idea.lane));
  if (idea.model) chips.append(el('span', { class: 'chip chip-model' }, idea.model));
  if (idea.size) chips.append(el('span', { class: 'chip' }, idea.size.toUpperCase()));
  if (idea.impact != null) chips.append(el('span', { class: 'chip chip-impact' }, '▲' + idea.impact));
  if (idea.verdict) chips.append(el('span', { class: 'chip' }, 'verdict: ' + idea.verdict));

  frag.append(el('h2', { id: 'drawer-title', class: 'drawer-title' }, el('code', { class: 'drawer-key' }, idea.key), idea.title), chips);

  const metaLines = [];
  if (idea.project) metaLines.push('Project: ' + idea.project);
  if (idea.tags && idea.tags.length) metaLines.push('Tags: ' + idea.tags.join(', '));
  if (metaLines.length) frag.append(el('p', { class: 'drawer-meta' }, metaLines.join(' · ')));

  frag.append(renderDateGrid(idea));

  if (idea.text) frag.append(el('section', { class: 'drawer-section' }, el('h3', {}, 'Text'), el('p', { class: 'drawer-text' }, idea.text)));
  if (idea.why) frag.append(el('section', { class: 'drawer-section' }, el('h3', {}, 'Why'), el('p', { class: 'drawer-text' }, idea.why)));
  if (idea.brief) frag.append(el('section', { class: 'drawer-section' }, el('h3', {}, 'Build brief'), el('p', { class: 'drawer-text' }, idea.brief)));

  const notes = renderNotes(idea.notes);
  if (notes) frag.append(notes);
  if (idea.dup_of != null) frag.append(renderDupOf(idea.dup_of));
  if (idea.related && idea.related.length) {
    const related = renderRelated(idea.related);
    if (related) frag.append(related);
  }
  return frag;
}

function renderDrawer() {
  const idea = state.openKey ? findByKey(state.openKey) : null;
  const wasHidden = $drawer.hidden;
  if (!idea) {
    if (!wasHidden) {
      $drawer.hidden = true;
      $drawerBackdrop.hidden = true;
      if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
      lastFocused = null;
    }
    return;
  }
  if (wasHidden) lastFocused = document.activeElement;
  $drawer.hidden = false;
  $drawerBackdrop.hidden = false;
  $drawerBody.textContent = '';
  $drawerBody.append(buildDrawerContent(idea));
  if (wasHidden) requestAnimationFrame(() => $drawerClose.focus());
}

function openTicket(key) { location.hash = key; }
function closeDrawer() { location.hash = state.view; }

/* ---- load error ---- */

class HttpError extends Error {
  constructor(status) { super('HTTP ' + status); this.status = status; }
}

function renderLoadError(err) {
  $main.textContent = '';
  $counts.textContent = '';
  $updated.textContent = '';
  const msg = err instanceof HttpError ? 'Could not load data.json (HTTP ' + err.status + ').' : 'Could not load data.json (' + (err && err.message ? err.message : 'network error') + ').';
  $main.append(el('div', { class: 'load-error' }, el('p', {}, msg)));
}

/* ---- top-level render and hash routing ---- */

function render() {
  renderHeader();
  renderTabsActive();
  if (state.query.trim() !== '') renderSearch();
  else if (state.view === 'timeline') renderTimeline();
  else if (state.view === 'groups') renderGroups();
  else renderBoard();
  renderDrawer();
}

function applyHash() {
  const raw = decodeURIComponent(location.hash.slice(1));
  if (raw === 'board' || raw === 'timeline' || raw === 'groups') {
    state.view = raw;
    state.openKey = null;
  } else if (/^IDEA-\d+$/i.test(raw)) {
    state.openKey = raw.toUpperCase();
  } else {
    state.openKey = null;
    if (raw) state.view = 'board';
  }
}

function onHashChange() { applyHash(); render(); }

function onSearchInput() {
  const q = $searchInput.value;
  state.query = q;
  clearTimeout(searchTimer);
  if (q.trim() === '') { state.searchResult = null; render(); return; }
  searchTimer = setTimeout(() => runSearch(q), SEARCH_DEBOUNCE_MS);
}

function bindStaticEvents() {
  for (const btn of $tabs.querySelectorAll('button')) {
    btn.addEventListener('click', () => {
      $searchInput.value = '';
      state.query = '';
      state.searchResult = null;
      location.hash = btn.dataset.view;
    });
  }
  $parkedToggle.addEventListener('change', () => { state.showParked = $parkedToggle.checked; render(); });
  $searchInput.addEventListener('input', onSearchInput);
  $searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(searchTimer); runSearch($searchInput.value); } });
  $drawerClose.addEventListener('click', closeDrawer);
  $drawerBackdrop.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$drawer.hidden) closeDrawer(); });
  document.addEventListener('click', () => { $tooltip.hidden = true; });
}

async function main() {
  bindStaticEvents();
  try {
    const res = await fetch('data.json', { cache: 'no-store' });
    if (!res.ok) throw new HttpError(res.status);
    const data = await res.json();
    state.data = data;
    for (const idea of data.ideas) {
      state.byId.set(idea.id, idea);
      state.byKey.set(idea.key.toUpperCase(), idea);
    }
    window.addEventListener('hashchange', onHashChange);
    applyHash();
    render();
  } catch (err) {
    renderLoadError(err);
  }
}

main();
</script>
