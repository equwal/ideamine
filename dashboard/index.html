/* ---- search: semantic first, word fallback ---- */

function wordSearch(q) {
  const words = q.toLowerCase().split(/\s+/).filter(Boolean);
  const items = [];
  for (const idea of state.data.ideas) {
    const hay = [idea.title, idea.text, (idea.tags || []).join(' '), idea.brief].filter(Boolean).join(' \n ').toLowerCase();
    let score = 0;
    for (const w of words) { if (hay.includes(w)) score++; }
    if (score >= 1) items.push({ idea, score });
  }
  items.sort((a, b) => b.score - a.score);
  return { mode: 'words', items };
}

async function trySemanticSearch(q, embed) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), EMBED_TIMEOUT_MS);
  try {
    const res = await fetch('v1/embeddings', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ model: embed.model, input: [embed.query_prefix + q] }),
      signal: ctrl.signal,
    });
    if (!res.ok) return null;
    const json = await res.json();
    const raw = json && json.data && json.data[0] && json.data[0].embedding;
    if (!Array.isArray(raw) || raw.length === 0) return null;
    const qvec = normalize(raw);
    const threshold = embed.search_threshold ?? 0.5;
    const items = [];
    for (const idea of state.data.ideas) {
      const vec = getIdeaVec(idea);
      if (!vec) continue;
      const score = dot(qvec, vec);
      if (score >= threshold) items.push({ idea, score });
    }
    items.sort((a, b) => b.score - a.score);
    return { mode: 'meaning', items };
  } catch (err) {
    return null;
  } finally {
    clearTimeout(timer);
  }
}

async function runSearch(query) {
  const q = query.trim();
  if (!q) { state.searchResult = null; render(); return; }
  const token = ++searchToken;
  state.searchResult = null;
  render();
  const embed = state.data.embed || {};
  const hasVecs = state.data.ideas.some((i) => i.vec);
  let result = null;
  if (embed.available && hasVecs) result = await trySemanticSearch(q, embed);
  if (token !== searchToken) return;
  if (!result) result = wordSearch(q);
  state.searchResult = result;
  render();
}

function searchResultCard(item) {
  const label = state.searchResult.mode === 'meaning' ? Math.round(item.score * 100) + '%' : item.score + (item.score === 1 ? ' word' : ' words');
  return ideaCard(item.idea, { compact: true, scoreLabel: label });
}

function renderSearch() {
  $main.textContent = '';
  if (!state.searchResult) { $main.append(el('p', { class: 'empty-note' }, 'Searching…')); return; }
  const { mode, items } = state.searchResult;
  const modeLabel = mode === 'meaning' ? 'Showing results by meaning' : 'Showing results by words, meaning search is not available';
  const wrap = el('div', { class: 'search-results' }, el('p', { class: 'search-mode' }, modeLabel));
  if (!items.length) wrap.append(el('p', { class: 'empty-note' }, 'No matching ideas.'));
  else wrap.append(el('div', { class: 'search-list' }, items.map(searchResultCard)));
  $main.append(wrap);
}

/* ---- shared by the prompts and memory tabs ---- */

async function getJson(url) {
  const res = await fetch(url, { cache: 'no-store' });
  let json = null;
  try { json = await res.json(); } catch (err) { json = null; }
  if (!res.ok || !json || !json.ok) throw new Error((json && json.error) || 'HTTP ' + res.status);
  return json;
}

function baseName(dir) { return String(dir || '').split(/[\\/]+/).filter(Boolean).pop() || 'no folder'; }

const isoOf = (seconds) => new Date(seconds * 1000).toISOString();

/** A timeline with one row per item: a span bar, and a mark for each event in the row. */
function renderRowsChart({ rows, label, count, span, marks, onRow, ariaLabel }) {
  const now = Date.now();
  let start = Infinity, end = -Infinity;
  for (const row of rows) {
    const [from, to] = span(row);
    start = Math.min(start, from);
    end = Math.max(end, to);
  }
  end = Math.max(end, start + 10 * MIN);
  const pad = (end - start) * 0.03;
  start -= pad;
  end += pad;
  const scale = buildTimeScale(start, end);
  const height = TL_HEADER_H + rows.length * TL_ROW_H;
  const axis = svgEl('g', {});
  for (const t of scale.ticks) {
    const x = scale.x(t);
    axis.append(svgEl('line', { x1: x, x2: x, y1: TL_HEADER_H, y2: height, class: 'tl-grid' }), svgEl('text', { x: x + 4, y: TL_HEADER_H - 8, class: 'tl-tick-label' }, formatTick(t, scale.step)));
  }
  const body = svgEl('g', {});
  rows.forEach((row, i) => {
    const y = TL_HEADER_H + i * TL_ROW_H;
    const barY = y + (TL_ROW_H - TL_BAR_H) / 2;
    const [from, to] = span(row);
    const x1 = scale.x(from);
    body.append(svgEl('rect', { x: x1, y: barY, width: Math.max(scale.x(to) - x1, 3), height: TL_BAR_H, rx: 3, class: 'tl-span' }));
    for (const node of marks(row, scale, barY)) body.append(node);
  });
  const svg = svgEl('svg', { width: scale.width, height, viewBox: '0 0 ' + scale.width + ' ' + height, role: 'img', 'aria-label': ariaLabel }, axis, body);
  if (now >= start && now <= end) {
    const nx = scale.x(now);
    svg.append(svgEl('line', { x1: nx, x2: nx, y1: 0, y2: height, class: 'tl-now' }), svgEl('text', { x: nx - 4, y: 11, 'text-anchor': 'end', class: 'tl-now-label' }, 'now'));
  }
  const labels = el('div', { class: 'tl-labels' },
    el('div', { class: 'tl-label-header', style: 'height:' + TL_HEADER_H + 'px' }),
    rows.map((row) => el('button', { class: 'tl-label-row', type: 'button', style: 'height:' + TL_ROW_H + 'px', onclick: () => onRow(row) },
      el('code', { class: 'tl-label-key' }, count(row)),
      el('span', { class: 'tl-label-title' }, label(row)))));
  return el('div', { class: 'tl-scroll' }, el('div', { class: 'tl-inner' }, labels, el('div', { class: 'tl-chart' }, svg)));
}

/* ---- prompts tab: the prompt log, one row for each Claude Code session ---- */

async function loadPrompts() {
  const p = state.prompts;
  p.loading = true;
  const days = p.days;
  try {
    const list = (await getJson('api/prompts?days=' + days)).prompts;
    if (days === p.days) p.list = list; // the range did not change during the load
    p.error = null;
  } catch (err) {
    p.list ||= [];
    p.error = err.message;
  }
  p.loading = false;
  render();
}

const sessionOf = (q) => q.session || (q.host || 'unknown') + ' ' + q.at.slice(0, 10);

/** One session for each session id, with its prompts in time order. The newest session comes first. */
function sessionsOf(prompts) {
  const byId = new Map();
  for (const q of prompts) {
    const id = sessionOf(q);
    if (!byId.has(id)) byId.set(id, { id, host: q.host, cwd: q.cwd, prompts: [] });
    const s = byId.get(id);
    s.prompts.push(q);
    if (q.cwd) s.cwd = q.cwd;
  }
  const sessions = [...byId.values()];
  for (const s of sessions) {
    s.from = Date.parse(s.prompts[0].at);
    s.to = Date.parse(s.prompts[s.prompts.length - 1].at);
  }
  return sessions.sort((a, b) => b.to - a.to);
}

// A chat without a project folder runs in a scratch folder of the desktop app. Its first prompt
// says more than the folder name.
function sessionLabel(s) {
  const name = baseName(s.cwd);
  const first = s.prompts && s.prompts[0];
  const label = /^scratch-\d{4}-\d{2}-\d{2}-/.test(name) && first ? '“' + first.prompt.replace(/\s+/g, ' ').slice(0, 60) + '”' : name;
  return label + (s.host ? ' · ' + s.host : '');
}

function matchesPromptFilter(q) {
  const f = state.prompts.filter.trim().toLowerCase();
  return !f || q.prompt.toLowerCase().includes(f) || String(q.cwd || '').toLowerCase().includes(f);
}

function renderPromptBody(body) {
  body.textContent = '';
  const p = state.prompts;
  if (p.error) body.append(el('p', { class: 'load-error' }, 'Could not load the prompts: ' + p.error));
  const list = p.list.filter(matchesPromptFilter);
  if (!list.length) {
    if (!p.error) body.append(el('p', { class: 'empty-note' }, 'No prompts in this time range.'));
    return;
  }
  const sessions = sessionsOf(list);
  body.append(el('p', { class: 'view-note' }, list.length + ' prompts in ' + sessions.length + ' sessions. A mark is one prompt.'));
  body.append(renderRowsChart({
    rows: sessions,
    ariaLabel: 'Sessions and their prompts',
    label: sessionLabel,
    count: (s) => String(s.prompts.length),
    span: (s) => [s.from, s.to],
    onRow: (s) => openTicket('SESSION:' + s.id),
    marks: (s, scale, barY) => s.prompts.map((q) => {
      const x = scale.x(Date.parse(q.at));
      const tick = svgEl('line', { x1: x, x2: x, y1: barY - 3, y2: barY + TL_BAR_H + 3, class: 'tl-tick', tabindex: '0', role: 'img', 'aria-label': fmtDate(q.at) + ': ' + q.prompt.slice(0, 80) });
      attachTooltip(tick, () => el('div', {}, el('div', { class: 'tooltip-key' }, fmtDate(q.at)), el('div', { class: 'tooltip-title' }, q.prompt.slice(0, 200))));
      tick.addEventListener('click', () => openTicket('SESSION:' + s.id));
      return tick;
    }),
  }));
  body.append(el('h2', { class: 'section-title' }, 'Latest prompts'));
  body.append(el('div', { class: 'row-list' }, list.slice(-30).reverse().map((q) =>
    el('button', { type: 'button', class: 'row-item', onclick: () => openTicket('SESSION:' + sessionOf(q)) },
      el('span', { class: 'row-meta' }, fmtDate(q.at), el('br'), baseName(q.cwd) + (q.host ? ' · ' + q.host : '')),
      el('span', { class: 'row-text' }, q.prompt)))));
}

function renderPrompts() {
  $main.textContent = '';
  const p = state.prompts;
  const range = el('select', { 'aria-label': 'Time range' }, PROMPT_RANGES.map(([days, label]) => el('option', { value: String(days), selected: days === p.days }, label)));
  range.addEventListener('change', () => { p.days = Number(range.value); p.list = null; render(); });
  const filter = el('input', { type: 'search', class: 'search-input', placeholder: 'Filter prompts…', 'aria-label': 'Filter prompts' });
  filter.value = p.filter;
  const body = el('div', {});
  // Only the list below the filter changes while you type, so the filter keeps the focus.
  filter.addEventListener('input', () => { p.filter = filter.value; if (p.list) renderPromptBody(body); });
  $main.append(el('div', { class: 'view-controls' }, range, filter), body);
  if (!p.list) body.append(el('p', { class: 'empty-note' }, 'Loading the prompts…'));
  else renderPromptBody(body);
}

function buildSessionDrawer(id) {
  const frag = document.createDocumentFragment();
  const list = (state.prompts.list || []).filter((q) => sessionOf(q) === id);
  if (!list.length) {
    frag.append(el('h2', { id: 'drawer-title', class: 'drawer-title' }, 'Session'),
      el('p', { class: 'text-muted' }, state.prompts.list ? 'This session has no prompts in the time range.' : 'Loading the prompts…'));
    return frag;
  }
  const first = list[0];
  frag.append(el('h2', { id: 'drawer-title', class: 'drawer-title' }, sessionLabel({ cwd: first.cwd, host: first.host, prompts: list })));
  frag.append(el('p', { class: 'drawer-meta' }, [first.cwd, first.session && 'session ' + first.session].filter(Boolean).join(' · ')));
  frag.append(el('p', { class: 'drawer-meta' }, fmtDate(first.at) + ' → ' + fmtDate(list[list.length - 1].at) + ' · ' + list.length + ' prompts'));
  const notes = el('div', { class: 'notes' });
  for (const q of list) notes.append(el('div', { class: 'note' }, el('div', { class: 'note-at' }, fmtDate(q.at)), el('div', { class: 'note-text' }, q.prompt)));
  frag.append(el('section', { class: 'drawer-section' }, el('h3', {}, 'Prompts'), notes));
  return frag;
}

/* ---- memory tab: what the memstate memories say, and when Claude wrote them ---- */

/** The projects and memories. With `refresh`, the texts and versions that the page has load again too. */
async function loadMemoryOverview(opts) {
  const m = state.memory;
  m.loading = true;
  try {
    m.overview = await getJson('api/memory/overview');
    m.error = null;
    if (opts && opts.refresh) {
      m.memories.clear();
      m.histories.clear();
    }
  } catch (err) {
    m.overview ||= { projects: [], memories: [] };
    m.error = err.message;
  }
  m.loading = false;
  render();
}

async function loadInto(map, key, url, pick) {
  if (map.has(key)) return;
  map.set(key, null); // loading
  try { map.set(key, pick(await getJson(url))); } catch (err) { map.set(key, { error: err.message }); }
  render();
}

function categoryChip(category) {
  const lane = CATEGORY_COLORS[category];
  return el('span', { class: 'chip chip-lane', style: '--chip-color:' + (lane ? 'var(--lane-' + lane + ')' : 'var(--text-muted)') }, category || 'memory');
}

const memKey = (project, keypath) => 'MEM:' + project + '|' + keypath;

function selectProject(id) {
  state.memory.project = id;
  render();
  const target = document.getElementById('mem-project');
  if (target) target.scrollIntoView({ block: 'start' });
}

function renderProjectMemories(id) {
  const wrap = el('section', { id: 'mem-project' }, el('h2', { class: 'section-title' }, 'Memories of ' + id));
  const url = 'api/memory/project?id=' + encodeURIComponent(id);
  const list = state.memory.memories.get(id);
  if (list === undefined) loadInto(state.memory.memories, id, url, (json) => json.memories);
  if (!list) { wrap.append(el('p', { class: 'empty-note' }, 'Loading…')); return wrap; }
  if (list.error) { wrap.append(el('p', { class: 'load-error' }, list.error)); return wrap; }
  const areas = new Map();
  for (const x of list) {
    const area = x.keypath.split('.')[0];
    if (!areas.has(area)) areas.set(area, []);
    areas.get(area).push(x);
  }
  for (const [area, items] of areas) {
    items.sort((a, b) => b.created_at - a.created_at);
    wrap.append(el('div', { class: 'mem-area' }, el('h3', {}, area), el('div', { class: 'mem-cards' }, items.map((x) =>
      el('button', { type: 'button', class: 'mem-card', onclick: () => openTicket(memKey(id, x.keypath)) },
        el('div', { class: 'card-top' }, categoryChip(x.category), el('span', { class: 'card-key' }, 'v' + x.version + ' · ' + fmtRelative(isoOf(x.created_at)))),
        el('div', { class: 'mem-key' }, x.keypath),
        el('div', { class: 'mem-preview' }, x.content || ''))))));
  }
  return wrap;
}

function renderMemory() {
  $main.textContent = '';
  const m = state.memory;
  if (!m.overview) { $main.append(el('p', { class: 'empty-note' }, 'Loading the memories…')); return; }
  if (m.error) $main.append(el('p', { class: 'load-error' }, 'Could not load the memories: ' + m.error));
  const { projects, memories } = m.overview;
  if (!projects.length) { if (!m.error) $main.append(el('p', { class: 'empty-note' }, 'memstate has no projects yet.')); return; }
  const sorted = projects.slice().sort((a, b) => (b.last_updated_at || b.created_at) - (a.last_updated_at || a.created_at));
  const byProject = new Map(sorted.map((p) => [p.id, []]));
  for (const x of memories) if (byProject.has(x.project_id)) byProject.get(x.project_id).push(x);
  $main.append(el('p', { class: 'view-note' }, projects.length + ' projects · ' + memories.length + ' memories. A dot is the last write of a memory.'));
  $main.append(renderRowsChart({
    rows: sorted,
    ariaLabel: 'Projects and their memory writes',
    label: (p) => p.id,
    count: (p) => String(p.memory_count),
    span: (p) => [p.created_at * 1000, (p.last_updated_at || p.created_at) * 1000],
    onRow: (p) => selectProject(p.id),
    marks: (p, scale, barY) => byProject.get(p.id).map((x) => {
      const lane = CATEGORY_COLORS[x.category];
      const dot = svgEl('circle', { cx: scale.x(x.created_at * 1000), cy: barY + TL_BAR_H / 2, r: 5, class: 'tl-dot', fill: lane ? 'var(--lane-' + lane + ')' : 'var(--text-muted)', tabindex: '0', role: 'img', 'aria-label': x.keypath + ', ' + fmtDate(isoOf(x.created_at)) });
      attachTooltip(dot, () => el('div', {}, el('div', { class: 'tooltip-key' }, x.keypath), el('div', { class: 'tooltip-title' }, p.id), el('div', { class: 'tooltip-phase' }, (x.category || 'memory') + ' · v' + x.version + ' · ' + fmtDate(isoOf(x.created_at)))));
      dot.addEventListener('click', () => openTicket(memKey(p.id, x.keypath)));
      return dot;
    }),
  }));
  $main.append(el('h2', { class: 'section-title' }, 'Latest writes'));
  const latest = memories.slice().sort((a, b) => b.created_at - a.created_at).slice(0, 12);
  $main.append(el('div', { class: 'row-list' }, latest.map((x) =>
    el('button', { type: 'button', class: 'row-item', onclick: () => openTicket(memKey(x.project_id, x.keypath)) },
      el('span', { class: 'row-meta' }, fmtDate(isoOf(x.created_at)), el('br'), x.project_id),
      el('span', { class: 'row-text' }, categoryChip(x.category), ' ', x.keypath, x.version > 1 ? ' · v' + x.version : '')))));
  if (!m.project || !byProject.has(m.project)) m.project = sorted[0].id;
  $main.append(renderProjectMemories(m.project));
}

function buildMemoryDrawer(key) {
  const cut = key.indexOf('|');
  const project = key.slice(0, cut);
  const keypath = key.slice(cut + 1);
  const url = 'api/memory/history?project=' + encodeURIComponent(project) + '&keypath=' + encodeURIComponent(keypath);
  const versions = state.memory.histories.get(key);
  if (versions === undefined) loadInto(state.memory.histories, key, url, (json) => json.versions);
  const frag = document.createDocumentFragment();
  frag.append(el('h2', { id: 'drawer-title', class: 'drawer-title' }, keypath), el('p', { class: 'drawer-meta' }, 'memstate project ' + project));
  if (!versions) { frag.append(el('p', { class: 'text-muted' }, 'Loading…')); return frag; }
  if (versions.error) { frag.append(el('p', { class: 'load-error' }, versions.error)); return frag; }
  const list = el('div', {});
  for (const v of versions.slice().reverse()) {
    list.append(el('div', { class: 'version' },
      el('div', { class: 'drawer-chips' }, categoryChip(v.category), el('span', { class: 'chip' }, 'v' + v.version), el('span', { class: 'note-at' }, fmtDate(isoOf(v.created_at)))),
      v.source ? el('p', { class: 'drawer-meta' }, v.source) : null,
      el('p', { class: 'drawer-text' }, v.tombstone ? '(deleted)' : v.content)));
  }
  frag.append(el('section', { class: 'drawer-section' }, el('h3', {}, versions.length + (versions.length === 1 ? ' version' : ' versions') + ', newest first'), list));
  return frag;
}

/* ---- detail drawer ---- */

function renderDateGrid(idea) {
  const grid = el('dl', { class: 'date-grid' });
  for (const [label, value] of [['Created', idea.created], ['Triaged', idea.triaged], ['Started', idea.started], ['Closed', idea.closed]]) {
    grid.append(el('dt', {}, label), el('dd', {}, value ? fmtDate(value) : '—'));
  }
  return grid;
}

function renderNotes(notes) {
  if (!notes || !notes.length) return null;
  const list = el('div', { class: 'notes' });
  for (const note of notes) list.append(el('div', { class: 'note' }, el('div', { class: 'note-at' }, fmtDate(note.at)), el('div', { class: 'note-text' }, note.text)));
  return el('section', { class: 'drawer-section' }, el('h3', {}, 'Notes'), list);
}

function renderDupOf(dupId) {
  const target = state.byId.get(dupId);
  const key = target ? target.key : 'IDEA-' + dupId;
  const content = target
    ? el('button', { class: 'link-button', type: 'button', onclick: () => openTicket(target.key) }, key + ' — ' + target.title)
    : el('span', { class: 'text-muted' }, key + ' (not found)');
  return el('section', { class: 'drawer-section' }, el('h3', {}, 'Duplicate of'), content);
}

function renderRelated(related) {
  const list = el('div', { class: 'related-list' });
  for (const r of related) {
    const target = state.byId.get(r.id);
    if (!target) continue;
    const pct = Math.round((r.score ?? 0) * 100) + '%';
    list.append(el('button', { class: 'link-button related-item', type: 'button', onclick: () => openTicket(target.key) },
      el('code', { class: 'card-key' }, target.key), el('span', { class: 'related-title' }, target.title), el('span', { class: 'related-score' }, pct)));
  }
  if (!list.childNodes.length) return null;
  return el('section', { class: 'drawer-section' }, el('h3', {}, 'Related'), list);
}

function buildDrawerContent(idea) {
  const frag = document.createDocumentFragment();
  const chips = el('div', { class: 'drawer-chips' }, el('span', { class: 'chip chip-lane', style: '--chip-color:var(--lane-' + idea.lane + ')' }, LANE_LABELS[idea.lane] || idea.lane));
  if (idea.model) chips.append(el('span', { class: 'chip chip-model' }, idea.model));
  if (idea.size) chips.append(el('span', { class: 'chip' }, idea.size.toUpperCase()));
  if (idea.impact != null) chips.append(el('span', { class: 'chip chip-impact' }, '▲' + idea.impact));
  if (idea.verdict) chips.append(el('span', { class: 'chip' }, 'verdict: ' + idea.verdict));

  frag.append(el('h2', { id: 'drawer-title', class: 'drawer-title' }, el('code', { class: 'drawer-key' }, idea.key), idea.title), chips);

  const metaLines = [];
  if (idea.project) metaLines.push('Project: ' + idea.project);
  if (idea.tags && idea.tags.length) metaLines.push('Tags: ' + idea.tags.join(', '));
  if (metaLines.length) frag.append(el('p', { class: 'drawer-meta' }, metaLines.join(' · ')));
  if (isLive()) frag.append(renderDrawerActions(idea));

  frag.append(renderDateGrid(idea));

  if (idea.text) frag.append(el('section', { class: 'drawer-section' }, el('h3', {}, 'Text'), el('p', { class: 'drawer-text' }, idea.text)));
  if (idea.why) frag.append(el('section', { class: 'drawer-section' }, el('h3', {}, 'Why'), el('p', { class: 'drawer-text' }, idea.why)));
  if (idea.brief) frag.append(el('section', { class: 'drawer-section' }, el('h3', {}, 'Build brief'), el('p', { class: 'drawer-text' }, idea.brief)));

  const notes = renderNotes(idea.notes);
  if (notes) frag.append(notes);
  if (idea.dup_of != null) frag.append(renderDupOf(idea.dup_of));
  if (idea.related && idea.related.length) {
    const related = renderRelated(idea.related);
    if (related) frag.append(related);
  }
  return frag;
}

/** The content of the open drawer: a ticket, a session of the prompt log, or a memory. */
function drawerContent(key) {
  if (!key) return null;
  if (key.startsWith('SESSION:')) return buildSessionDrawer(key.slice('SESSION:'.length));
  if (key.startsWith('MEM:')) return buildMemoryDrawer(key.slice('MEM:'.length));
  const idea = findByKey(key);
  return idea ? buildDrawerContent(idea) : null;
}

function renderDrawer() {
  const content = drawerContent(state.openKey);
  const wasHidden = $drawer.hidden;
  if (!content) {
    if (!wasHidden) {
      $drawer.hidden = true;
      $drawerBackdrop.hidden = true;
      if (lastFocused && document.contains(lastFocused)) lastFocused.focus();
      lastFocused = null;
    }
    return;
  }
  if (wasHidden) lastFocused = document.activeElement;
  $drawer.hidden = false;
  $drawerBackdrop.hidden = false;
  $drawerBody.textContent = '';
  $drawerBody.append(content);
  if (wasHidden) requestAnimationFrame(() => $drawerClose.focus());
}

function openTicket(key) { location.hash = key; }
function closeDrawer() { location.hash = state.view; }

/* ---- commands: the slash commands as buttons, on the page of `ideamine serve` ---- */

function isLive() { return !!(state.data && state.data.live); }

function showToast(text, kind) {
  clearTimeout(toastTimer);
  $toast.textContent = text;
  $toast.className = 'toast toast-' + kind;
  $toast.hidden = false;
  if (kind !== 'busy') toastTimer = setTimeout(() => { $toast.hidden = true; }, kind === 'error' ? 15000 : 8000);
}

async function callApi(action, body) {
  const res = await fetch('api/' + action, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body || {}),
  });
  let json = null;
  try { json = await res.json(); } catch (err) { json = null; }
  if (!res.ok || !json || !json.ok) throw new Error((json && json.error) || 'HTTP ' + res.status);
  return json.message;
}

function setBusy(on) {
  state.busy = on;
  document.body.classList.toggle('busy', on);
  $main.setAttribute('aria-busy', String(on));
}

/** Run one command, show its answer, and load the new data. Resolves to true when the command worked. */
async function runAction(action, body, busyText) {
  if (state.busy) return false;
  setBusy(true);
  showToast(busyText || 'Working…', 'busy');
  let worked = false;
  try {
    const message = await callApi(action, body);
    worked = true;
    showToast(message, 'ok');
    await loadData();
  } catch (err) {
    showToast(worked ? 'Done, but the page could not load the new data: ' + err.message : err.message, 'error');
  }
  setBusy(false);
  if (/^IDEA-/.test(String(state.openKey)) && !findByKey(state.openKey)) {
    // The idea of the open ticket is gone: close the ticket without a new history entry.
    history.replaceState(null, '', '#' + state.view);
    state.openKey = null;
  }
  render();
  if (!$drawer.hidden && !$drawer.contains(document.activeElement)) $drawerClose.focus();
  if (worked && state.query.trim()) runSearch(state.query);
  return worked;
}

function renderToolbar() {
  const live = isLive();
  $actions.hidden = !live;
  $readonlyNote.hidden = live;
  if (!live) return;
  const inbox = (state.data.counts && state.data.counts.inbox) || 0;
  // Triage, Build, Ask, and the watcher need the Claude Code login: a server without it hides them.
  const claude = !!state.data.live.claude;
  $triage.textContent = 'Triage inbox (' + inbox + ')';
  $triage.disabled = inbox === 0;
  $triage.hidden = !claude;
  $buildNext.hidden = !(claude && state.data.live.window);
  $askOpen.hidden = !claude;
  $watchLabel.hidden = !claude;
  const watch = state.data.live.watch || {};
  $watchToggle.checked = !!watch.on;
  $watchLabel.title = watch.status || '';
}

function actionButton(label, kind, onClick, title) {
  return el('button', { type: 'button', class: 'btn' + (kind ? ' btn-' + kind : ''), title: title || null, onclick: onClick }, label);
}

function renderDrawerActions(idea) {
  const id = idea.id;
  const open = OPEN_LANES.includes(idea.lane);
  const closed = idea.lane === 'done' || idea.lane === 'dropped';
  const note = el('textarea', { rows: '2', placeholder: 'Note. Done and Drop save it too.', 'aria-label': 'Note' });
  const noteText = () => note.value.trim() || undefined;
  const update = (patch) => runAction('update', Object.assign({ id }, patch));

  const buttons = [];
  if (!closed && state.data.live.window && state.data.live.claude) {
    buttons.push(actionButton('Build with Claude', 'primary', () => runAction('go', { id }, 'Opening Claude Code for ' + idea.key + '…'),
      'Open Claude Code on the recommended model, in the project of the idea (/ideas-go ' + id + ')'));
  }
  if (!closed && idea.lane !== 'doing') buttons.push(actionButton('Start', '', () => update({ status: 'doing' })));
  if (open) buttons.push(actionButton('Done', '', () => update({ status: 'done', note: noteText() }), '/ideas-done ' + id));
  if (open || idea.lane === 'skip') buttons.push(actionButton('Drop', '', () => update({ status: 'dropped', note: noteText() })));
  if (!open || idea.lane === 'doing') buttons.push(actionButton('Reopen', '', () => update({ status: 'reopen' }), 'Put the idea back in the queue (/ideas-reopen ' + id + ')'));
  buttons.push(actionButton('Delete', 'danger', () => {
    if (confirm('Delete ' + idea.key + ' for good?')) runAction('rm', { ids: [id] });
  }, '/ideas-rm ' + id));

  const model = el('select', { class: 'model-select', 'aria-label': 'Model for the build' },
    idea.model ? null : el('option', { value: '' }, 'none'),
    MODELS.map((m) => el('option', { value: m, selected: idea.model === m }, m)));
  model.addEventListener('change', () => { if (model.value) update({ model: model.value }); });
  const addNote = actionButton('Add note', '', () => {
    const text = noteText();
    if (text) update({ note: text });
    else note.focus();
  });

  return el('section', { class: 'drawer-section' },
    el('h3', {}, 'Actions'),
    el('div', { class: 'drawer-actions' }, buttons),
    note,
    el('div', { class: 'drawer-actions' }, addNote, el('label', { class: 'model-label' }, 'Build model ', model)));
}

async function saveIdea() {
  const text = $composerText.value.trim();
  if (!text) { $composerText.focus(); return; }
  if (await runAction('add', { text }, 'Saving…')) {
    $composerText.value = '';
    $composer.hidden = true;
  }
}

/** The text of an answer, with each #12 that names an idea as a link to its ticket. */
function linkIdeas(text) {
  const parts = [];
  let last = 0;
  for (const m of text.matchAll(/#(\d+)/g)) {
    const idea = state.byId.get(Number(m[1]));
    if (!idea) continue;
    parts.push(text.slice(last, m.index), el('button', { type: 'button', class: 'link-button', onclick: () => openTicket(idea.key) }, m[0]));
    last = m.index + m[0].length;
  }
  parts.push(text.slice(last));
  return parts;
}

async function askQuestion() {
  const question = $askInput.value.trim();
  if (!question || state.busy) return;
  setBusy(true);
  $askAnswer.textContent = 'Claude reads your ideas…';
  try {
    const answer = await callApi('ask', { question });
    $askAnswer.textContent = '';
    $askAnswer.append(...linkIdeas(answer));
  } catch (err) {
    $askAnswer.textContent = 'No answer: ' + err.message;
  }
  setBusy(false);
}

function togglePanel(panel, focusTarget) {
  panel.hidden = !panel.hidden;
  if (!panel.hidden) focusTarget.focus();
}

/* ---- load error ---- */

class HttpError extends Error {
  constructor(status) { super('HTTP ' + status); this.status = status; }
}

function renderLoadError(err) {
  $main.textContent = '';
  $counts.textContent = '';
  $updated.textContent = '';
  const msg = err instanceof HttpError ? 'Could not load data.json (HTTP ' + err.status + ').' : 'Could not load data.json (' + (err && err.message ? err.message : 'network error') + ').';
  $main.append(el('div', { class: 'load-error' }, el('p', {}, msg)));
}

/* ---- top-level render and hash routing ---- */

function render() {
  renderHeader();
  renderTabsActive();
  renderToolbar();
  if (state.query.trim() !== '') renderSearch();
  else if (state.view === 'timeline') renderTimeline();
  else if (state.view === 'table') renderTable();
  else if (state.view === 'projects') renderProjects();
  else if (state.view === 'flow') renderFlow();
  else if (state.view === 'matrix') renderMatrix();
  else if (state.view === 'groups') renderGroups();
  else if (state.view === 'prompts') renderPrompts();
  else if (state.view === 'memory') renderMemory();
  else renderBoard();
  renderDrawer();
  // The prompt log and the memories load when a tab or a drawer needs them.
  const wantsPrompts = state.view === 'prompts' || String(state.openKey).startsWith('SESSION:');
  if (wantsPrompts && !state.prompts.list && !state.prompts.loading) loadPrompts();
  if (state.view === 'memory' && !state.memory.overview && !state.memory.loading) loadMemoryOverview();
}

function applyHash() {
  const raw = decodeURIComponent(location.hash.slice(1));
  if (VIEWS.includes(raw)) {
    state.view = raw;
    state.openKey = null;
  } else if (/^IDEA-\d+$/i.test(raw)) {
    state.openKey = raw.toUpperCase();
  } else if (/^(SESSION|MEM):/.test(raw)) {
    state.openKey = raw;
  } else {
    state.openKey = null;
    if (raw) state.view = 'board';
  }
}

function onHashChange() { applyHash(); render(); }

function onSearchInput() {
  const q = $searchInput.value;
  state.query = q;
  clearTimeout(searchTimer);
  if (q.trim() === '') { state.searchResult = null; render(); return; }
  searchTimer = setTimeout(() => runSearch(q), SEARCH_DEBOUNCE_MS);
}

function bindStaticEvents() {
  for (const btn of $tabs.querySelectorAll('button')) {
    btn.addEventListener('click', () => {
      $searchInput.value = '';
      state.query = '';
      state.searchResult = null;
      location.hash = btn.dataset.view;
    });
  }
  $parkedToggle.addEventListener('change', () => { state.showParked = $parkedToggle.checked; render(); });
  $searchInput.addEventListener('input', onSearchInput);
  $searchInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') { clearTimeout(searchTimer); runSearch($searchInput.value); } });
  $drawerClose.addEventListener('click', closeDrawer);
  $drawerBackdrop.addEventListener('click', closeDrawer);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$drawer.hidden) closeDrawer(); });
  document.addEventListener('click', () => { $tooltip.hidden = true; });

  $newIdea.addEventListener('click', () => togglePanel($composer, $composerText));
  $composerSave.addEventListener('click', saveIdea);
  $composerCancel.addEventListener('click', () => { $composer.hidden = true; });
  $composerText.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); saveIdea(); }
  });
  $triage.addEventListener('click', () => runAction('sort', {}, 'Claude triages the inbox…'));
  $buildNext.addEventListener('click', () => runAction('go', {}, 'Claude triages the new ideas, then Claude Code opens on the next one…'));
  $askOpen.addEventListener('click', () => togglePanel($askPanel, $askInput));
  $askSend.addEventListener('click', askQuestion);
  $askInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') askQuestion(); });
  $askClose.addEventListener('click', () => { $askPanel.hidden = true; });
  $watchToggle.addEventListener('change', () => runAction('watch', { on: $watchToggle.checked }));
  $toast.addEventListener('click', () => { $toast.hidden = true; });
  // The watcher and other sessions change the archive too. Show their changes when the page comes back.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || !isLive() || state.busy) return;
    // The old data stays on the page until the new data is here, so nothing flickers.
    if (state.prompts.list && !state.prompts.loading) loadPrompts();
    if (state.memory.overview && !state.memory.loading) loadMemoryOverview({ refresh: true });
    loadData().then(render, () => {});
  });
}

async function loadData() {
  const res = await fetch('data.json', { cache: 'no-store' });
  if (!res.ok) throw new HttpError(res.status);
  const data = await res.json();
  state.data = data;
  state.byId.clear();
  state.byKey.clear();
  vecCache.clear();
  for (const idea of data.ideas) {
    state.byId.set(idea.id, idea);
    state.byKey.set(idea.key.toUpperCase(), idea);
  }
}

async function main() {
  bindStaticEvents();
  try {
    await loadData();
    window.addEventListener('hashchange', onHashChange);
    applyHash();
    render();
  } catch (err) {
    renderLoadError(err);
  }
}

main();
</script>
</body>
</html>
