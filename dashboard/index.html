<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self'; img-src 'self' data:">
<meta name="color-scheme" content="light dark">
<title>ideamine</title>
<style>
/* Theme tokens. Dark mode overrides the same names. */
:root {
  color-scheme: light dark;
  --bg: #f9f9f7;
  --surface: #fcfcfb;
  --surface-2: #f1f1ee;
  --text: #0b0b0b;
  --text-dim: #52514e;
  --text-muted: #898781;
  --border: #e1e0d9;
  --border-strong: #c3c2b7;
  --accent: #2a78d6;
  --focus-ring: #2a78d6;
  --shadow: 0 8px 24px rgba(11, 11, 11, 0.16);
  --lane-doing: #2a78d6;
  --lane-do: #1baf7a;
  --lane-maybe: #eda100;
  --lane-inbox: #898781;
  --lane-skip: #4a3aa7;
  --lane-done: #0ca30c;
  --lane-dropped: #d03b3b;
  --phase-inbox: #86b6ef;
  --phase-queued: #3987e5;
  --phase-doing: #184f95;
  --flow-inbox: #7a6fc9;
  --now-line: #0b0b0b;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232322;
    --text: #ffffff;
    --text-dim: #c3c2b7;
    --text-muted: #898781;
    --border: #2c2c2a;
    --border-strong: #383835;
    --accent: #3987e5;
    --focus-ring: #86b6ef;
    --shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
    --lane-doing: #3987e5;
    --lane-do: #199e70;
    --lane-maybe: #c98500;
    --lane-inbox: #898781;
    --lane-skip: #9085e9;
    --lane-done: #0ca30c;
    --lane-dropped: #e66767;
    --phase-inbox: #184f95;
    --phase-queued: #3987e5;
    --phase-doing: #86b6ef;
    --flow-inbox: #8f7fe0;
    --now-line: #ffffff;
  }
}

* { box-sizing: border-box; }
[hidden] { display: none !important; } /* a class with a display value must not show a hidden element */
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  font-size: 14px;
  line-height: 1.45;
}
h1, h2, h3, p, dl, dd { margin: 0; }
button { font: inherit; color: inherit; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

/* header */
.app-header { position: sticky; top: 0; z-index: 5; background: var(--surface); border-bottom: 1px solid var(--border); }
.header-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 12px; }
.header-top { justify-content: space-between; padding-top: 10px; }
.brand { font-size: 18px; font-weight: 700; }
.updated { color: var(--text-muted); font-size: 12px; }
.counts { padding-top: 0; }
.count-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-dim); }
.count-chip-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--chip-color); flex: none; }
.header-controls { padding-top: 0; padding-bottom: 10px; }
.tabs { display: flex; gap: 4px; }
.tabs button { padding: 6px 12px; border: 1px solid var(--border); background: var(--surface-2); border-radius: 6px; cursor: pointer; }
.tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
.parked-toggle { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-dim); white-space: nowrap; cursor: pointer; }
.search-input { flex: 1 1 160px; min-width: 120px; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); color: var(--text); }

/* layout */
main { padding: 12px; }
.empty-note { color: var(--text-muted); padding: 24px 4px; }
.load-error { padding: 24px; color: var(--lane-dropped); }

/* board */
.board { display: flex; align-items: flex-start; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
/* min-width keeps each lane at its width. Without it, a long note in a card makes the lane wide. */
.column { flex: 0 0 260px; min-width: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.column-header { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--border); font-weight: 600; }
.column-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--chip-color); flex: none; }
.column-title { flex: 1; }
.column-count { color: var(--text-muted); font-weight: 400; }
.column-body { display: flex; flex-direction: column; gap: 8px; padding: 8px; min-height: 12px; }
.column-empty { color: var(--text-muted); font-size: 12px; padding: 4px; }
.column.drop-over { border-color: var(--accent); background: var(--surface-2); }
.card.dragging { opacity: .45; }
.card[draggable="true"] { cursor: grab; }

/* ticket cards */
.card { display: block; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.card:hover { border-color: var(--border-strong); }
.card-compact { padding: 6px 8px; }
.card-top { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 4px; }
.card-key { font-size: 11px; color: var(--text-muted); }
.card-chips { display: flex; gap: 4px; flex-wrap: wrap; }
.card-title { font-size: 13px; }
.card-meta { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.card-project { font-size: 11px; color: var(--text-muted); }
.card-score { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--accent); }
.card-note { font-size: 11px; color: var(--text-dim); margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* chips (lane / model / size / impact / tag) */
.chip { display: inline-flex; align-items: center; border: 1px solid var(--border-strong); border-radius: 999px; padding: 1px 8px; font-size: 11px; color: var(--text-dim); background: var(--surface-2); white-space: nowrap; }
.chip-lane { border-color: var(--chip-color); color: var(--chip-color); font-weight: 600; background: transparent; }
.chip-model { text-transform: capitalize; }
.chip-tag::before { content: "#"; opacity: .6; }

/* groups view */
.group-section { margin-bottom: 20px; }
.group-title { font-size: 15px; font-weight: 700; margin-bottom: 8px; }
.group-count { color: var(--text-muted); font-weight: 400; }
.group-cards { display: flex; flex-wrap: wrap; gap: 8px; }
.group-cards .card { width: 220px; }

/* search results */
.search-mode { color: var(--text-muted); font-size: 12px; margin-bottom: 8px; }
.search-list { display: flex; flex-direction: column; gap: 8px; max-width: 520px; }

/* timeline (gantt) */
.tl-legend { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 6px 2px 10px; font-size: 12px; color: var(--text-dim); }
.tl-legend-item { display: inline-flex; align-items: center; gap: 5px; }
.tl-legend-swatch { display: inline-block; width: 14px; height: 10px; border-radius: 2px; background: var(--chip-color); }
.tl-legend-hatch { background-image: repeating-linear-gradient(45deg, var(--chip-color) 0 2px, transparent 2px 4px); }
.tl-legend-mark { font-weight: 700; }
.tl-scroll { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
.tl-inner { display: flex; align-items: flex-start; width: max-content; }
.tl-labels { position: sticky; left: 0; z-index: 2; background: var(--surface); border-right: 1px solid var(--border); flex: 0 0 auto; }
.tl-label-header { border-bottom: 1px solid var(--border); }
.tl-label-row { display: flex; align-items: center; gap: 6px; width: 220px; padding: 0 8px; border: 0; border-bottom: 1px solid var(--border); background: none; cursor: pointer; text-align: left; }
.tl-label-row:hover, .tl-label-row:focus-visible { background: var(--surface-2); }
.tl-label-key { font-size: 11px; color: var(--text-muted); flex: none; }
.tl-label-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tl-chart { flex: 0 0 auto; }
.tl-grid { stroke: var(--border); stroke-width: 1; }
.tl-tick-label { fill: var(--text-muted); font-size: 10px; }
.tl-now { stroke: var(--now-line); stroke-width: 1.5; stroke-dasharray: 4 3; }
.tl-now-label { fill: var(--now-line); font-size: 10px; }
.tl-seg-inbox { fill: var(--phase-inbox); }
.tl-seg-queued { fill: var(--phase-queued); }
.tl-seg-doing { fill: var(--phase-doing); }
.tl-seg-estimated.tl-seg-inbox { fill: url(#hatch-inbox); }
.tl-seg-estimated.tl-seg-queued { fill: url(#hatch-queued); }
.tl-seg-estimated.tl-seg-doing { fill: url(#hatch-doing); }
.tl-seg { cursor: pointer; }
.tl-seg:hover, .tl-seg:focus-visible { stroke: var(--text); stroke-width: 1.5; outline: none; }
.tl-end-mark { font-size: 13px; font-weight: 700; dominant-baseline: middle; }
.tl-end-done { fill: var(--lane-done); }
.tl-end-dropped { fill: var(--lane-dropped); }

/* detail drawer */
.drawer-backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .4); z-index: 20; }
.drawer-backdrop[hidden] { display: none; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: 420px; max-width: 100%; background: var(--surface); box-shadow: var(--shadow); z-index: 21; overflow-y: auto; padding: 16px; }
.drawer[hidden] { display: none; }
@media (max-width: 640px) { .drawer { width: 100%; } }
.drawer-close { position: sticky; top: 0; float: right; background: none; border: none; font-size: 22px; line-height: 1; cursor: pointer; color: var(--text-dim); }
.drawer-title { font-size: 16px; font-weight: 700; margin: 4px 0 10px; clear: both; }
.drawer-key { color: var(--text-muted); font-size: 13px; margin-right: 6px; }
.drawer-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
.drawer-meta { color: var(--text-dim); font-size: 12px; margin-bottom: 10px; }
.date-grid { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 12px; margin-bottom: 14px; }
.date-grid dt { color: var(--text-muted); }
.drawer-section { margin-bottom: 16px; }
.drawer-section h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 6px; }
.drawer-text { white-space: pre-wrap; font-size: 13px; }
.notes { display: flex; flex-direction: column; gap: 8px; }
.note { border-left: 2px solid var(--border-strong); padding-left: 8px; }
.note-at { font-size: 11px; color: var(--text-muted); }
.note-text { white-space: pre-wrap; font-size: 13px; }
.link-button { background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; text-align: left; font: inherit; }
.related-list { display: flex; flex-direction: column; gap: 6px; }
.related-item { display: flex; align-items: center; gap: 8px; width: 100%; }
.related-title { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--text); }
.related-score { color: var(--text-muted); font-size: 11px; }
.text-muted { color: var(--text-muted); }

/* hover / tap preview for timeline bars */
.tooltip { position: fixed; z-index: 30; max-width: 240px; background: var(--surface-2); border: 1px solid var(--border-strong); border-radius: 6px; padding: 6px 8px; font-size: 12px; box-shadow: var(--shadow); pointer-events: none; }
.tooltip[hidden] { display: none; }
.tooltip-key { font-weight: 700; }
.tooltip-title { color: var(--text-dim); margin: 2px 0; }
.tooltip-phase { color: var(--text-muted); }

/* table view */
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
.idea-table { border-collapse: collapse; width: 100%; font-size: 13px; }
.idea-table th, .idea-table td { padding: 6px 10px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: top; white-space: nowrap; }
.idea-table th { position: sticky; top: 0; background: var(--surface-2); font-weight: 600; font-size: 12px; }
.idea-table th button { background: none; border: none; padding: 0; cursor: pointer; font: inherit; font-weight: 600; color: var(--text-dim); }
.idea-table th[aria-sort] button { color: var(--text); }
.idea-table td.col-title { white-space: normal; min-width: 240px; }
.idea-table tbody tr { cursor: pointer; }
.idea-table tbody tr:hover, .idea-table tbody tr:focus-visible { background: var(--surface-2); outline: none; }
.sort-mark { font-size: 10px; margin-left: 3px; }

/* projects view */
.projects-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; }
.projects { display: grid; grid-auto-rows: minmax(48px, auto); width: max-content; }
.projects > div { border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); padding: 6px; min-width: 200px; }
.projects .proj-head { position: sticky; top: 0; z-index: 2; background: var(--surface-2); font-weight: 600; display: flex; align-items: center; gap: 6px; }
.projects .proj-name { position: sticky; left: 0; z-index: 1; background: var(--surface); min-width: 180px; max-width: 180px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
.projects .proj-name.proj-head { z-index: 3; }
.projects .proj-open { display: block; color: var(--text-muted); font-weight: 400; font-size: 12px; }
.projects .proj-cell { display: flex; flex-direction: column; gap: 6px; max-width: 260px; }

/* flow view: tiles, then the cumulative flow chart */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
.tile { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; }
.tile-label { font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); }
.tile-value { font-size: 22px; font-weight: 700; line-height: 1.2; margin-top: 2px; }
.tile-note { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
.mix-bar { display: flex; height: 10px; border-radius: 3px; overflow: hidden; gap: 2px; margin-top: 8px; background: var(--surface-2); }
.mix-seg { background: var(--chip-color); }
.mix-legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; font-size: 12px; color: var(--text-dim); }
.mix-legend span::before { content: ""; display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--chip-color); margin-right: 4px; }
.flow-chart { width: 100%; height: auto; display: block; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
.flow-area { stroke: var(--surface); stroke-width: 2; stroke-linejoin: round; }
.flow-grid { stroke: var(--border); stroke-width: 1; }
.flow-tick { fill: var(--text-muted); font-size: 10px; }
.flow-cross { stroke: var(--text); stroke-width: 1; stroke-dasharray: 3 3; pointer-events: none; }
.flow-hit { fill: transparent; cursor: crosshair; }
.tooltip-row { display: flex; justify-content: space-between; gap: 12px; }
.tooltip-swatch { display: inline-block; width: 8px; height: 8px; border-radius: 2px; background: var(--chip-color); margin-right: 5px; }

/* matrix view */
.matrix-wrap { overflow-x: auto; }
.matrix { display: grid; grid-template-columns: 64px repeat(5, minmax(150px, 1fr)); gap: 2px; min-width: 820px; }
.matrix > div { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px; min-height: 56px; position: relative; }
.matrix .mx-head { background: var(--surface-2); font-weight: 600; text-align: center; min-height: 0; display: flex; align-items: center; justify-content: center; }
.matrix .mx-count { position: absolute; top: 4px; right: 6px; font-size: 11px; color: var(--text-muted); }
.matrix .mx-corner { font-size: 11px; color: var(--text-muted); text-align: right; }
.matrix .mx-note { position: absolute; bottom: 4px; right: 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); }
.matrix .mx-win { border-color: var(--lane-do); }
.matrix .mx-avoid { border-color: var(--lane-dropped); }
.matrix-chip { display: flex; gap: 6px; align-items: baseline; width: 100%; text-align: left; background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 3px 6px; margin-bottom: 4px; cursor: pointer; font-size: 12px; }
.matrix-chip:hover { border-color: var(--border-strong); }
.matrix-chip .card-key { flex: none; }
.matrix-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.matrix-rest { color: var(--text-muted); font-size: 12px; margin-top: 8px; }

/* commands: only on the page of `ideamine serve` */
.header-actions { padding-top: 0; padding-bottom: 10px; }
.readonly-note { color: var(--text-muted); font-size: 12px; padding-top: 0; padding-bottom: 8px; }
.btn { display: inline-flex; align-items: center; padding: 5px 10px; border: 1px solid var(--border-strong); border-radius: 6px; background: var(--surface-2); color: var(--text); font-size: 13px; cursor: pointer; }
.btn:hover:not(:disabled) { border-color: var(--text-muted); }
.btn:disabled { opacity: .5; cursor: default; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-danger { background: transparent; border-color: var(--lane-dropped); color: var(--lane-dropped); }
body.busy .btn, body.busy #watch-toggle, body.busy .model-select { pointer-events: none; opacity: .5; }
.panel { display: flex; flex-direction: column; gap: 8px; margin: 12px 12px 0; padding: 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.panel[hidden] { display: none; }
.panel-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.panel-hint { color: var(--text-muted); font-size: 12px; }
textarea, select { font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
textarea { width: 100%; resize: vertical; }
.answer { white-space: pre-wrap; font-size: 13px; }
.answer:empty { display: none; }
.drawer-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.model-label { font-size: 12px; color: var(--text-dim); }
.toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 40; width: max-content; max-width: min(560px, calc(100% - 32px)); padding: 8px 12px; background: var(--surface-2); border: 1px solid var(--border-strong); border-left: 4px solid var(--lane-done); border-radius: 6px; box-shadow: var(--shadow); font-size: 13px; white-space: pre-wrap; cursor: pointer; }
.toast[hidden] { display: none; }
.toast-busy { border-left-color: var(--accent); }
.toast-error { border-left-color: var(--lane-dropped); }

/* prompts and memory tabs */
.view-controls { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; font-size: 12px; color: var(--text-dim); }
.view-note { color: var(--text-muted); font-size: 12px; }
.section-title { font-size: 13px; font-weight: 700; margin: 18px 0 8px; }
.row-list { display: flex; flex-direction: column; gap: 6px; max-width: 860px; }
.row-item { display: grid; grid-template-columns: 150px 1fr; gap: 10px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.row-item:hover { border-color: var(--border-strong); }
.row-meta { font-size: 11px; color: var(--text-muted); }
.row-text { font-size: 13px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; white-space: pre-wrap; word-break: break-word; }
@media (max-width: 640px) { .row-item { grid-template-columns: 1fr; gap: 2px; } }
.tl-tick { stroke: var(--text-dim); stroke-width: 2; cursor: pointer; }
.tl-tick:hover, .tl-tick:focus-visible { stroke: var(--text); stroke-width: 3; outline: none; }
.tl-span { fill: var(--phase-inbox); }
.tl-dot { stroke: var(--surface); stroke-width: 1; cursor: pointer; }
.tl-dot:hover, .tl-dot:focus-visible { stroke: var(--text); stroke-width: 2; outline: none; }
.mem-area { margin-bottom: 14px; }
.mem-area h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin-bottom: 6px; }
.mem-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; }
.mem-card { text-align: left; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; cursor: pointer; }
.mem-card:hover { border-color: var(--border-strong); }
.mem-key { font-size: 12px; font-weight: 600; word-break: break-all; }
.mem-preview { font-size: 12px; color: var(--text-dim); white-space: pre-wrap; word-break: break-word; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; margin-top: 4px; }
.version { border-left: 2px solid var(--border-strong); padding-left: 8px; margin-bottom: 12px; }

/* focus */
button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible, [tabindex]:focus-visible {
  outline: 2px solid var(--focus-ring);
  outline-offset: 2px;
}
</style>
</head>
<body>
<header class="app-header">
  <div class="header-row header-top">
    <h1 class="brand">ideamine</h1>
    <span class="updated" id="updated"></span>
  </div>
  <div class="header-row counts" id="counts" aria-label="Idea counts by lane"></div>
  <div class="header-row header-controls">
    <nav class="tabs" id="tabs" role="tablist" aria-label="Views">
      <button type="button" role="tab" data-view="board" aria-controls="main">Board</button>
      <button type="button" role="tab" data-view="timeline" aria-controls="main">Timeline</button>
      <button type="button" role="tab" data-view="table" aria-controls="main">Table</button>
      <button type="button" role="tab" data-view="projects" aria-controls="main">Projects</button>
      <button type="button" role="tab" data-view="flow" aria-controls="main">Flow</button>
      <button type="button" role="tab" data-view="matrix" aria-controls="main">Matrix</button>
      <button type="button" role="tab" data-view="groups" aria-controls="main">Groups</button>

  <div id="drawer-body"></div>
</aside>

<div class="tooltip" id="tooltip" hidden role="status"></div>
<div class="toast" id="toast" hidden role="status" aria-live="polite" title="Click to close"></div>

<script>
'use strict';

/* ideamine dashboard. One file, no build step, no external calls
   besides data.json and v1/embeddings on the same origin. On the page of
   `ideamine serve`, data.json has `live`, and the buttons call api/ there. */

const SVG_NS = 'http://www.w3.org/2000/svg';
const MIN = 60000, HOUR = 3600000, DAY = 86400000;
const TL_STEPS = [MIN, 5 * MIN, 15 * MIN, 30 * MIN, HOUR, 3 * HOUR, 6 * HOUR, 12 * HOUR, DAY, 2 * DAY, 7 * DAY, 30 * DAY, 90 * DAY];
const TL_ROW_H = 34, TL_HEADER_H = 28, TL_BAR_H = 16;
const BOARD_LANES = ['doing', 'do', 'maybe', 'inbox', 'done'];
const PARKED_LANES = ['skip', 'dropped'];
const ALL_LANES = ['doing', 'do', 'maybe', 'inbox', 'skip', 'done', 'dropped'];
const LANE_LABELS = { doing: 'Doing', do: 'Do', maybe: 'Maybe', inbox: 'Inbox', skip: 'Skip', done: 'Done', dropped: 'Dropped' };
const PHASE_LABELS = { inbox: 'Inbox', queued: 'Queued', doing: 'Doing' };
const SEARCH_DEBOUNCE_MS = 300;
const EMBED_TIMEOUT_MS = 4000;
const MODELS = ['haiku', 'sonnet', 'opus', 'fable'];
const OPEN_LANES = ['doing', 'do', 'maybe', 'inbox'];
const VIEWS = ['board', 'timeline', 'table', 'projects', 'flow', 'matrix', 'groups', 'prompts', 'memory'];
const FLOW_STACK = ['dropped', 'skip', 'done', 'doing', 'do', 'maybe', 'inbox']; // bottom to top
const SIZE_ORDER = ['xs', 's', 'm', 'l', 'xl'];
const PROMPT_RANGES = [[1, 'Last day'], [7, 'Last 7 days'], [30, 'Last 30 days'], [0, 'All']];
// Memory categories share the lane colors, so that the page needs no new colors.
const CATEGORY_COLORS = { status: 'doing', decision: 'do', gotcha: 'dropped', config: 'maybe', note: 'inbox', reference: 'skip', learning: 'skip' };

const state = {
  data: null,
  byId: new Map(),
  byKey: new Map(),
  view: 'board',
  showParked: false,
  openKey: null,
  query: '',
  searchResult: null,
  busy: false,
  tableSort: { key: 'rank', dir: 1 },
  drag: null, // the card that the user drags on the board: { id, lane }
  prompts: { days: 1, list: null, error: null, filter: '' },
  memory: { overview: null, error: null, project: null, memories: new Map(), histories: new Map() },
};

let searchTimer = null;
let searchToken = 0;
let lastFocused = null;
let toastTimer = null;
const vecCache = new Map();

const $main = document.getElementById('main');
const $counts = document.getElementById('counts');
const $updated = document.getElementById('updated');
const $tabs = document.getElementById('tabs');
const $parkedToggle = document.getElementById('parked-toggle');
const $searchInput = document.getElementById('search-input');
const $drawer = document.getElementById('drawer');
const $drawerBackdrop = document.getElementById('drawer-backdrop');
const $drawerClose = document.getElementById('drawer-close');
const $drawerBody = document.getElementById('drawer-body');
const $tooltip = document.getElementById('tooltip');
const $actions = document.getElementById('actions');
const $readonlyNote = document.getElementById('readonly-note');
const $newIdea = document.getElementById('new-idea');
const $triage = document.getElementById('triage');
const $buildNext = document.getElementById('build-next');
const $askOpen = document.getElementById('ask-open');
const $watchLabel = document.getElementById('watch-label');
const $watchToggle = document.getElementById('watch-toggle');
const $composer = document.getElementById('composer');
const $composerText = document.getElementById('composer-text');
const $composerSave = document.getElementById('composer-save');
const $composerCancel = document.getElementById('composer-cancel');
const $askPanel = document.getElementById('ask-panel');
const $askInput = document.getElementById('ask-input');
const $askSend = document.getElementById('ask-send');
const $askClose = document.getElementById('ask-close');
const $askAnswer = document.getElementById('ask-answer');
const $toast = document.getElementById('toast');

/* ---- small DOM builders. Text children become text nodes, never HTML. ---- */

function el(tag, attrs, ...kids) {
  const node = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') node.className = v;
      else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    node.append(kid.nodeType ? kid : String(kid));
  }
  return node;
}

function svgEl(tag, attrs, ...kids) {
  const node = document.createElementNS(SVG_NS, tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      node.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    node.append(kid.nodeType ? kid : String(kid));
  }
  return node;
}

/* ---- formatting ---- */

// The page text is English, so dates and "5 minutes ago" are English too, whatever the browser locale.
const LOCALE = 'en';

function fmtDate(iso) {
  if (!iso) return null;
  const d = new Date(iso);
  if (Number.isNaN(d.getTime())) return iso;
  return d.toLocaleString(LOCALE, { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
}

function fmtRelative(iso) {
  const then = new Date(iso).getTime();
  if (Number.isNaN(then)) return 'at an unknown time';
  const diffSec = Math.round((then - Date.now()) / 1000);
  const rtf = new Intl.RelativeTimeFormat(LOCALE, { numeric: 'auto' });
  const units = [['year', 31536000], ['month', 2592000], ['day', 86400], ['hour', 3600], ['minute', 60], ['second', 1]];
  for (const [unit, secs] of units) {
    if (Math.abs(diffSec) >= secs || unit === 'second') return rtf.format(Math.round(diffSec / secs), unit);
  }
}

function fmtDuration(ms) {
  if (ms == null) return null;
  if (ms < HOUR) return Math.max(1, Math.round(ms / MIN)) + ' min';
  if (ms < DAY) return Math.round(ms / HOUR) + ' h';
  const days = ms / DAY;
  return (days < 10 ? days.toFixed(1) : Math.round(days)) + ' d';
}

function laneColor(lane) { return lane === 'inbox' ? 'var(--flow-inbox)' : 'var(--lane-' + lane + ')'; }

function visibleIdeas() {
  return state.data.ideas.filter((i) => state.showParked || !PARKED_LANES.includes(i.lane));
}

function formatTick(t, step) {
  const d = new Date(t);
  if (step < HOUR) return d.toLocaleTimeString(LOCALE, { hour: '2-digit', minute: '2-digit' });
  if (step < DAY) return d.toLocaleString(LOCALE, { month: 'short', day: 'numeric', hour: '2-digit' });
  if (step < 30 * DAY) return d.toLocaleDateString(LOCALE, { month: 'short', day: 'numeric' });
  return d.toLocaleDateString(LOCALE, { month: 'short', year: 'numeric' });
}

/* ---- vectors: decode base64 little-endian float32, dot product ---- */

function decodeVec(b64) {
  if (!b64) return null;
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  const view = new DataView(bytes.buffer);
  const n = Math.floor(bin.length / 4);
  const out = new Float32Array(n);
  for (let i = 0; i < n; i++) out[i] = view.getFloat32(i * 4, true);
  return out;
}

function getIdeaVec(idea) {
  if (!idea.vec) return null;
  if (vecCache.has(idea.id)) return vecCache.get(idea.id);
  const v = decodeVec(idea.vec);
  vecCache.set(idea.id, v);
  return v;
}

function normalize(arr) {
  let sum = 0;
  for (let i = 0; i < arr.length; i++) sum += arr[i] * arr[i];
  const norm = Math.sqrt(sum) || 1;
  const out = new Float64Array(arr.length);
  for (let i = 0; i < arr.length; i++) out[i] = arr[i] / norm;
  return out;
}

function dot(a, b) {
  const n = Math.min(a.length, b.length);
  let s = 0;
  for (let i = 0; i < n; i++) s += a[i] * b[i];
  return s;
}

function findByKey(key) { return state.byKey.get(key.toUpperCase()) || null; }

/* ---- ticket card, shared by board, groups, and search results ---- */

function ideaCard(idea, opts) {
  opts = opts || {};
  const chips = [el('span', { class: 'chip chip-lane', style: '--chip-color:var(--lane-' + idea.lane + ')' }, LANE_LABELS[idea.lane] || idea.lane)];
  if (idea.model) chips.push(el('span', { class: 'chip chip-model' }, idea.model));
  if (idea.size) chips.push(el('span', { class: 'chip' }, idea.size.toUpperCase()));
  if (idea.impact != null) chips.push(el('span', { class: 'chip chip-impact' }, '▲' + idea.impact));

  const top = el('div', { class: 'card-top' }, el('code', { class: 'card-key' }, idea.key), el('span', { class: 'card-chips' }, chips));
  if (opts.scoreLabel) top.append(el('span', { class: 'card-score' }, opts.scoreLabel));

  // Work in progress shows its latest note, for example the phase of the agent pipeline.
  const lastNote = idea.lane === 'doing' && idea.notes && idea.notes.length ? idea.notes[idea.notes.length - 1] : null;
  const meta = [];
  if (idea.project) meta.push(el('span', { class: 'card-project' }, idea.project));
  for (const t of idea.tags || []) meta.push(el('span', { class: 'chip chip-tag' }, t));

  const card = el('button', { class: 'card' + (opts.compact ? ' card-compact' : ''), type: 'button', onclick: () => openTicket(idea.key) },
    top,
    el('div', { class: 'card-title' }, idea.title),
    lastNote ? el('div', { class: 'card-note', title: lastNote.text }, lastNote.text) : null,
    meta.length ? el('div', { class: 'card-meta' }, meta) : null);
  if (isLive()) makeDraggable(card, idea);
  return card;
}

/* ---- drag and drop on the board ---- */

/** The card tells the board which idea moves. A drop then runs the command for the new lane. */
function makeDraggable(card, idea) {
  card.draggable = true;
  card.addEventListener('dragstart', (e) => {
    state.drag = { id: idea.id, lane: idea.lane };
    card.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', idea.key);
  });
  card.addEventListener('dragend', () => {
    card.classList.remove('dragging');
    state.drag = null;
  });
}

/**
 * The command for a card that the user drops in `lane`, or null when the drop changes nothing.
 * A drop in Doing starts the build where Claude Code is. A page without Claude Code only moves the
 * idea, and the machine with the login builds it.
 */
function dropCommand(idea, lane) {
  if (!idea || idea.lane === lane) return null;
  const live = state.data.live || {};
  if (lane === 'doing' && live.claude && live.window) {
    return { action: 'go', body: { id: idea.id }, busy: 'Opening Claude Code for ' + idea.key + '…' };
  }
  if (['doing', 'done', 'dropped', 'inbox'].includes(lane)) return { action: 'update', body: { id: idea.id, status: lane } };
  if (['do', 'maybe', 'skip'].includes(lane)) return { action: 'verdict', body: { id: idea.id, verdict: lane } };
  return null;
}

/** A lane column takes a card. */
function makeDropTarget(column, lane) {
  column.addEventListener('dragover', (e) => {
    if (!state.drag || state.drag.lane === lane) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    column.classList.add('drop-over');
  });
  column.addEventListener('dragleave', (e) => {
    if (!column.contains(e.relatedTarget)) column.classList.remove('drop-over');
  });
  column.addEventListener('drop', (e) => {
    e.preventDefault();
    column.classList.remove('drop-over');
    const drag = state.drag;
    state.drag = null;
    const command = drag && dropCommand(state.byId.get(drag.id), lane);
    if (command) runAction(command.action, command.body, command.busy);
  });
}

/* ---- header: counts + relative update time ---- */

function renderHeader() {
  $counts.textContent = '';
  const counts = state.data.counts || {};
  for (const lane of ALL_LANES) {
    $counts.append(el('span', { class: 'count-chip' },
      el('span', { class: 'count-chip-dot', style: '--chip-color:var(--lane-' + lane + ')' }),
      LANE_LABELS[lane] + ' ' + (counts[lane] ?? 0)));
  }
  const sync = state.data.live && state.data.live.sync;
  let where = '';
  if (sync) where = sync.offline ? ' · the server does not answer: copy on this PC' : ' · shared by every machine';
  if (sync && sync.waiting) where += ' · ' + sync.waiting + ' waiting';
  $updated.textContent = 'updated ' + fmtRelative(state.data.generated) + where;
  $updated.title = fmtDate(state.data.generated) + (sync ? ' · ' + sync.url + (sync.offline ? ' · ' + sync.offline : '') : '');
}

function renderTabsActive() {
  const live = state.data.live || {};
  for (const btn of $tabs.querySelectorAll('button')) {
    const view = btn.dataset.view;
    if (view === 'prompts') btn.hidden = !live.prompts;
    if (view === 'memory') btn.hidden = !live.memory;
    const active = view === state.view;
    btn.classList.toggle('active', active);
    btn.setAttribute('aria-selected', String(active));
  }
}

/* ---- board view ---- */

function renderColumn(lane) {
  const ideas = state.data.ideas.filter((i) => i.lane === lane).sort((a, b) => a.rank - b.rank);
  const column = el('div', { class: 'column' },
    el('div', { class: 'column-header' },
      el('span', { class: 'column-dot', style: '--chip-color:var(--lane-' + lane + ')' }),
      el('span', { class: 'column-title' }, LANE_LABELS[lane]),
      el('span', { class: 'column-count' }, String(ideas.length))),
    el('div', { class: 'column-body' }, ideas.length ? ideas.map((i) => ideaCard(i)) : el('p', { class: 'column-empty' }, 'No tickets')));
  if (isLive()) makeDropTarget(column, lane);
  return column;
}

function renderBoard() {
  $main.textContent = '';
  const lanes = state.showParked ? BOARD_LANES.concat(PARKED_LANES) : BOARD_LANES;
  $main.append(el('div', { class: 'board' }, lanes.map(renderColumn)));
}

/* ---- groups view ---- */

function renderGroupSection(label, ideas) {
  return el('section', { class: 'group-section' },
    el('h2', { class: 'group-title' }, label + ' ', el('span', { class: 'group-count' }, '(' + ideas.length + ')')),
    el('div', { class: 'group-cards' }, ideas.map((i) => ideaCard(i, { compact: true }))));
}

function renderGroups() {
  $main.textContent = '';
  const wrap = el('div', { class: 'groups' });
  const grouped = new Set();
  for (const g of state.data.groups || []) {
    const ideas = g.ids.map((id) => state.byId.get(id)).filter(Boolean);
    for (const id of g.ids) grouped.add(id);
    wrap.append(renderGroupSection(g.label, ideas));
  }
  const ungrouped = state.data.ideas.filter((i) => !grouped.has(i.id));
  if (ungrouped.length) wrap.append(renderGroupSection('Ungrouped', ungrouped));
  $main.append(wrap);
}

/* ---- timeline (gantt) view ---- */

function chooseStep(spanMs, targetTicks) {
  for (const step of TL_STEPS) { if (spanMs / step <= targetTicks) return step; }
  return TL_STEPS[TL_STEPS.length - 1];
}

function buildTimeScale(domainStart, domainEnd) {
  const span = Math.max(domainEnd - domainStart, 1);
  const step = chooseStep(span, 8);
  const ticksCount = Math.ceil(span / step) + 1;
  const width = Math.max(640, ticksCount * 90);
  const pxPerMs = width / span;
  const ticks = [];
  const first = Math.ceil(domainStart / step) * step;
  for (let t = first; t <= domainEnd; t += step) ticks.push(t);
  return { width, step, ticks, x: (t) => (t - domainStart) * pxPerMs };
}

function makeHatchPattern(id, colorVar) {
  return svgEl('pattern', { id, patternUnits: 'userSpaceOnUse', width: 6, height: 6, patternTransform: 'rotate(45)' },
    svgEl('rect', { width: 6, height: 6, fill: colorVar, 'fill-opacity': 0.35 }),
    svgEl('line', { x1: 0, y1: 0, x2: 0, y2: 6, stroke: colorVar, 'stroke-width': 3 }));
}

function tooltipContentForSegment(idea, seg) {
  const to = seg.to ? fmtDate(seg.to) : 'now';
  return el('div', {},
    el('div', { class: 'tooltip-key' }, idea.key + (seg.estimated ? ' (estimated)' : '')),
    el('div', { class: 'tooltip-title' }, idea.title),
    el('div', { class: 'tooltip-phase' }, (PHASE_LABELS[seg.phase] || seg.phase) + ': ' + fmtDate(seg.from) + ' → ' + to));
}

function positionTooltip(evt, node) {
  const rect = node.getBoundingClientRect();
  const x = evt.clientX ?? (rect.left + rect.width / 2);
  const y = evt.clientY ?? rect.top;
  const pad = 12, tw = 240, th = 90;
  let left = x + pad, top = y + pad;
  if (left + tw > window.innerWidth) left = x - tw - pad;
  if (top + th > window.innerHeight) top = y - th - pad;
  $tooltip.style.left = Math.max(4, left) + 'px';
  $tooltip.style.top = Math.max(4, top) + 'px';
}

function attachTooltip(node, contentFn) {
  const show = (evt) => {
    $tooltip.textContent = '';
    $tooltip.append(contentFn());
    $tooltip.hidden = false;
    positionTooltip(evt, node);
  };
  const hide = () => { $tooltip.hidden = true; };
  node.addEventListener('mouseenter', show);
  node.addEventListener('mousemove', (e) => { if (!$tooltip.hidden) positionTooltip(e, node); });
  node.addEventListener('mouseleave', hide);
  node.addEventListener('focus', show);
  node.addEventListener('blur', hide);
  node.addEventListener('click', (e) => { e.stopPropagation(); show(e); });
}

function renderTimelineRow(idea, y, scale) {
  const g = svgEl('g', { class: 'tl-row' });
  const barY = y + (TL_ROW_H - TL_BAR_H) / 2;
  const phases = idea.phases || [];
  let endX = null;
  phases.forEach((seg, i) => {
    const from = Date.parse(seg.from);
    if (Number.isNaN(from)) return;
    const to = seg.to ? Date.parse(seg.to) : Date.now();
    let x1 = scale.x(from);
    let x2 = scale.x(Math.max(to, from));
    if (i > 0) x1 += 1;
    if (i < phases.length - 1) x2 -= 1;
    const w = Math.max(x2 - x1, 1);
    const phaseName = seg.phase || 'inbox';
    const rect = svgEl('rect', {
      x: x1, y: barY, width: w, height: TL_BAR_H, rx: 3,
      class: 'tl-seg tl-seg-' + phaseName + (seg.estimated ? ' tl-seg-estimated' : ''),
      tabindex: '0', role: 'img',
      'aria-label': idea.key + ' ' + (PHASE_LABELS[phaseName] || phaseName) + ' from ' + fmtDate(seg.from) + ' to ' + (seg.to ? fmtDate(seg.to) : 'now'),
    });
    attachTooltip(rect, () => tooltipContentForSegment(idea, seg));
    g.append(rect);
    endX = x1 + w;
  });
  if (endX != null && (idea.lane === 'done' || idea.lane === 'dropped')) {
    const mark = idea.lane === 'done' ? '✓' : '✗';
    g.append(svgEl('text', { x: endX + 6, y: y + TL_ROW_H / 2 + 4, class: 'tl-end-mark tl-end-' + idea.lane }, mark));
  }
  return g;
}

function renderTimelineLegend() {
  function item(colorVar, label, hatch) {
    return el('span', { class: 'tl-legend-item' }, el('span', { class: 'tl-legend-swatch' + (hatch ? ' tl-legend-hatch' : ''), style: '--chip-color:' + colorVar }), label);
  }
  return el('div', { class: 'tl-legend' },
    item('var(--phase-inbox)', 'Inbox'),
    item('var(--phase-queued)', 'Queued'),
    item('var(--phase-doing)', 'Doing'),
    item('var(--phase-doing)', 'Estimated', true),
    el('span', { class: 'tl-legend-item' }, el('span', { class: 'tl-legend-mark', style: 'color:var(--lane-done)' }, '✓'), 'Done'),
    el('span', { class: 'tl-legend-item' }, el('span', { class: 'tl-legend-mark', style: 'color:var(--lane-dropped)' }, '✗'), 'Dropped'));
}

function renderTimeline() {
  $main.textContent = '';
  const ideas = state.data.ideas
    .filter((i) => state.showParked || (i.lane !== 'skip' && i.lane !== 'dropped'))
    .slice()
    .sort((a, b) => Date.parse(a.created) - Date.parse(b.created));

  if (!ideas.length) {
    $main.append(el('p', { class: 'empty-note' }, 'No ideas to show.'));
    return;
  }

  const now = Date.now();
  let domainStart = Infinity, domainEnd = -Infinity;
  for (const idea of ideas) {
    for (const seg of idea.phases || []) {
      const from = Date.parse(seg.from);
      const to = seg.to ? Date.parse(seg.to) : now;
      if (!Number.isNaN(from)) domainStart = Math.min(domainStart, from);
      if (!Number.isNaN(to)) domainEnd = Math.max(domainEnd, to);
    }
  }
  if (!Number.isFinite(domainStart)) domainStart = now - DAY;
  domainEnd = Math.max(domainEnd, now);
  const pad = (domainEnd - domainStart) * 0.03 || HOUR;
  domainStart -= pad;
  domainEnd += pad;

  const scale = buildTimeScale(domainStart, domainEnd);
  const chartHeight = TL_HEADER_H + ideas.length * TL_ROW_H;

  const defs = svgEl('defs', {}, makeHatchPattern('hatch-inbox', 'var(--phase-inbox)'), makeHatchPattern('hatch-queued', 'var(--phase-queued)'), makeHatchPattern('hatch-doing', 'var(--phase-doing)'));

  const axis = svgEl('g', { class: 'tl-axis' });
  for (const t of scale.ticks) {
    const x = scale.x(t);
    axis.append(svgEl('line', { x1: x, x2: x, y1: TL_HEADER_H, y2: chartHeight, class: 'tl-grid' }), svgEl('text', { x: x + 4, y: TL_HEADER_H - 8, class: 'tl-tick-label' }, formatTick(t, scale.step)));
  }

  const rows = svgEl('g', { class: 'tl-rows' });
  ideas.forEach((idea, i) => rows.append(renderTimelineRow(idea, TL_HEADER_H + i * TL_ROW_H, scale)));

  const svgRoot = svgEl('svg', { width: scale.width, height: chartHeight, viewBox: '0 0 ' + scale.width + ' ' + chartHeight, role: 'img', 'aria-label': 'Idea timeline' }, defs, axis, rows);

  if (now >= domainStart && now <= domainEnd) {
    const nx = scale.x(now);
    svgRoot.append(svgEl('line', { x1: nx, x2: nx, y1: 0, y2: chartHeight, class: 'tl-now' }), svgEl('text', { x: nx - 4, y: 11, 'text-anchor': 'end', class: 'tl-now-label' }, 'now'));
  }

  const labels = el('div', { class: 'tl-labels' },
    el('div', { class: 'tl-label-header', style: 'height:' + TL_HEADER_H + 'px' }),
    ideas.map((idea) => el('button', { class: 'tl-label-row', type: 'button', style: 'height:' + TL_ROW_H + 'px', onclick: () => openTicket(idea.key) },
      el('code', { class: 'tl-label-key' }, idea.key),
      el('span', { class: 'tl-label-title' }, idea.title))));

  const scroll = el('div', { class: 'tl-scroll' }, el('div', { class: 'tl-inner' }, labels, el('div', { class: 'tl-chart' }, svgRoot)));
  $main.append(renderTimelineLegend(), scroll);
}

/* ---- flow view: tiles, then the cumulative flow chart ---- */

function tile(label, value, note) {
  return el('div', { class: 'tile' }, el('div', { class: 'tile-label' }, label), el('div', { class: 'tile-value' }, value), note ? el('div', { class: 'tile-note' }, note) : null);
}

function modelMixTile(models) {
  const total = MODELS.reduce((sum, m) => sum + (models[m] || 0), 0);
  const node = el('div', { class: 'tile' }, el('div', { class: 'tile-label' }, 'Model mix, open ideas'), el('div', { class: 'tile-value' }, String(total)));
  if (!total) { node.append(el('div', { class: 'tile-note' }, 'No triaged open ideas yet.')); return node; }
  // One hue, a darker step for each more costly model; the legend names each one.
  const steps = ['var(--phase-inbox)', 'var(--phase-queued)', 'var(--phase-doing)', 'var(--text)'];
  const bar = el('div', { class: 'mix-bar', 'aria-hidden': 'true' });
  const legend = el('div', { class: 'mix-legend' });
  MODELS.forEach((m, n) => {
    if (!models[m]) return;
    bar.append(el('span', { class: 'mix-seg', style: '--chip-color:' + steps[n] + '; flex:' + models[m] }));
    legend.append(el('span', { style: '--chip-color:' + steps[n] }, m + ' ' + models[m]));
  });
  node.append(bar, legend);
  return node;
}

function renderTiles(stats) {
  return el('div', { class: 'tiles' },
    tile('Open', String(stats.open), stats.oldest_open_ms != null ? 'oldest waits ' + fmtDuration(stats.oldest_open_ms) : null),
    tile('Done, last 7 days', String(stats.done_7d), stats.dropped_7d ? stats.dropped_7d + ' dropped' : null),
    tile('Median lead time', fmtDuration(stats.lead_median_ms) || '—', 'created → done'),
    tile('Median cycle time', fmtDuration(stats.cycle_median_ms) || '—', stats.cycle_median_ms == null ? 'no recorded starts yet' : 'started → done'),
    modelMixTile(stats.models || {}));
}

function niceStep(max, ticks) {
  const rough = max / ticks;
  const mag = Math.pow(10, Math.floor(Math.log10(rough || 1)));
  for (const m of [1, 2, 5, 10]) { if (m * mag >= rough) return m * mag; }
  return 10 * mag;
}

function renderFlowChart(flow) {
  const lanes = FLOW_STACK.filter((l) => state.showParked || !PARKED_LANES.includes(l));
  const times = flow.times.map((t) => Date.parse(t));
  const n = times.length;
  const W = 900, H = 260, left = 36, right = 12, top = 10, bottom = 24;
  const innerW = W - left - right, innerH = H - top - bottom;
  const totals = times.map((_, k) => lanes.reduce((sum, l) => sum + (flow.series[l][k] || 0), 0));
  const maxTotal = Math.max(1, ...totals);
  const step = niceStep(maxTotal, 4);
  const yMax = Math.ceil(maxTotal / step) * step;
  const x = (k) => left + (n > 1 ? (times[k] - times[0]) / (times[n - 1] - times[0]) * innerW : innerW / 2);
  const y = (v) => top + innerH - (v / yMax) * innerH;

  const svg = svgEl('svg', { class: 'flow-chart', viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': 'Cumulative flow: ' + lanes.map((l) => LANE_LABELS[l] + ' ' + flow.series[l][n - 1]).join(', ') + ' now' });
  const grid = svgEl('g');
  for (let v = 0; v <= yMax; v += step) {
    grid.append(svgEl('line', { x1: left, x2: W - right, y1: y(v), y2: y(v), class: 'flow-grid' }), svgEl('text', { x: left - 6, y: y(v) + 3, 'text-anchor': 'end', class: 'flow-tick' }, String(v)));
  }
  const scale = buildTimeScale(times[0], times[n - 1]);
  const span = Math.max(times[n - 1] - times[0], 1);
  for (const t of scale.ticks) {
    const px = left + ((t - times[0]) / span) * innerW;
    grid.append(svgEl('line', { x1: px, x2: px, y1: top, y2: top + innerH, class: 'flow-grid' }), svgEl('text', { x: px, y: H - 8, 'text-anchor': 'middle', class: 'flow-tick' }, formatTick(t, scale.step)));
  }
  svg.append(grid);

  const base = new Array(n).fill(0);
  for (const lane of lanes) {
    const tops = base.map((b, k) => b + (flow.series[lane][k] || 0));
    let d = '';
    for (let k = 0; k < n; k++) d += (k ? 'L' : 'M') + x(k).toFixed(1) + ',' + y(tops[k]).toFixed(1);
    for (let k = n - 1; k >= 0; k--) d += 'L' + x(k).toFixed(1) + ',' + y(base[k]).toFixed(1);
    svg.append(svgEl('path', { d: d + 'Z', fill: laneColor(lane), class: 'flow-area' }));
    for (let k = 0; k < n; k++) base[k] = tops[k];
  }

  const cross = svgEl('line', { x1: 0, x2: 0, y1: top, y2: top + innerH, class: 'flow-cross', visibility: 'hidden' });
  const hit = svgEl('rect', { x: left, y: top, width: innerW, height: innerH, class: 'flow-hit' });
  const tooltipAt = (k) => {
    const box = el('div', {}, el('div', { class: 'tooltip-key' }, fmtDate(flow.times[k])));
    for (const lane of lanes.slice().reverse()) {
      box.append(el('div', { class: 'tooltip-row' }, el('span', {}, el('span', { class: 'tooltip-swatch', style: '--chip-color:' + laneColor(lane) }), LANE_LABELS[lane]), el('span', {}, String(flow.series[lane][k] || 0))));
    }
    box.append(el('div', { class: 'tooltip-row tooltip-phase' }, el('span', {}, 'Total'), el('span', {}, String(totals[k]))));
    return box;
  };
  hit.addEventListener('pointermove', (evt) => {
    const rect = svg.getBoundingClientRect();
    const px = ((evt.clientX - rect.left) / rect.width) * W;
    let best = 0;
    for (let k = 1; k < n; k++) { if (Math.abs(x(k) - px) < Math.abs(x(best) - px)) best = k; }
    cross.setAttribute('x1', x(best)); cross.setAttribute('x2', x(best)); cross.setAttribute('visibility', 'visible');
    $tooltip.textContent = ''; $tooltip.append(tooltipAt(best)); $tooltip.hidden = false;
    positionTooltip(evt, svg);
  });
  hit.addEventListener('pointerleave', () => { cross.setAttribute('visibility', 'hidden'); $tooltip.hidden = true; });
  svg.append(cross, hit);

  const legend = el('div', { class: 'tl-legend' }, lanes.slice().reverse().map((l) => el('span', { class: 'tl-legend-item' }, el('span', { class: 'tl-legend-swatch', style: '--chip-color:' + laneColor(l) }), LANE_LABELS[l])));
  return el('div', {}, legend, svg);
}

function renderFlow() {
  $main.textContent = '';
  const stats = state.data.stats;
  const flow = state.data.flow;
  if (!stats || !flow) { $main.append(el('p', { class: 'empty-note' }, 'This snapshot has no flow data. Publish it again with the current ideamine.')); return; }
  $main.append(renderTiles(stats));
  if (!flow.times.length) { $main.append(el('p', { class: 'empty-note' }, 'No ideas yet.')); return; }
